  <line class="link-stroke" x1="600" y1="550" x2="750" y2="388"/>
  <line class="link-stroke" x1="600" y1="550" x2="828" y2="550"/>
  <line class="link-stroke" x1="600" y1="550" x2="750" y2="712"/>
  <line class="link-stroke" x1="600" y1="550" x2="450" y2="712"/>
  <line class="link-stroke" x1="600" y1="550" x2="372" y2="550"/>

  <!-- Outer gears -->
  <g transform="translate(450,388)">
    <use href="#outer-gear"/>
  </g>
  <g transform="translate(750,388)">
    <use href="#outer-gear"/>
  </g>
  <g transform="translate(828,550)">
