<form class="search-bar-container" (submit)="onSubmit($event)">
  <input
    type="text"
    placeholder="e.g. O95631, NTN1, signaling by EGFR, glucose"
    class="search-input"
    [value]="query"
    (input)="onInput($event)"
    (focus)="showDropdown()"
    (blur)="hideDropdownDelayed()"
    autocomplete="off"
  />
  <button type="submit" class="search-button" (click)="onSubmit($event)">Go!</button>
</form>

@if (query && suggestions.length > 0 && showSuggestions) {
  <div class="suggestions-container">
    <ul class="suggestions-list">
      @for (s of suggestions; track s) {
        <li (mousedown)="selectSuggestion(s)">
          <a [href]="'/content/query?q=' + s">
            {{ s }}
          </a>
        </li>
      }
    </ul>
  </div>
}
