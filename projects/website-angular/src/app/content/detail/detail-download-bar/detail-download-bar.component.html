@if (shown()) {
  <div class="figure-tools" role="group" aria-label="Downloads">
    <div class="tool-group">
      <mat-icon fontSet="symbols" class="tool-icon">description</mat-icon>

      <a class="dl-link" [href]="sbmlUrl()" [download]="stId() + '.sbml'" matTooltip="Export as SBML">SBML</a>

      <!-- Level 3 only, and called what it is. Level 2 has been superseded for
           years; offering both put a menu in the way of the one people want. -->
      <a class="dl-link" [href]="biopaxUrl()" [download]="stId() + '.owl'" matTooltip="Export as BioPAX Level 3"
        >BioPAX</a
      >

      <a class="dl-link" [href]="pdfUrl()" [download]="stId() + '.pdf'" matTooltip="Export as a PDF document">PDF</a>
    </div>

    @if (showFigureExports()) {
      <div class="tool-group figure-group">
        <mat-icon fontSet="symbols" class="tool-icon">download</mat-icon>

        <a class="dl-link" [href]="svgUrl()" [download]="stId() + '.svg'" matTooltip="Download the figure as SVG"
          >SVG</a
        >

        <button
          type="button"
          class="dl-link dl-menu"
          [matMenuTriggerFor]="pngMenu"
          matTooltip="Download the figure as PNG"
        >
          PNG<mat-icon fontSet="symbols">arrow_drop_down</mat-icon>
        </button>
        <mat-menu #pngMenu="matMenu">
          @for (tier of tiers; track tier.label) {
            <a mat-menu-item [href]="pngUrl(tier.scale)" [download]="stId() + '.png'">{{ tier.label }}</a>
          }
        </mat-menu>

        <a
          class="dl-link"
          [href]="pptxUrl()"
          [download]="stId() + '.pptx'"
          matTooltip="Download the figure as PowerPoint"
          >PPTX</a
        >

        <a class="dl-link" [href]="sbgnUrl()" [download]="stId() + '.sbgn'" matTooltip="Export as SBGN">SBGN</a>
      </div>
    }
  </div>
}
