<h2 class="home-spotlight-title">Reactome Research Spotlight</h2>
@if (spotlight(); as article) {
  <!-- The date as the news gives its dates, the title on its own line
       (outreach, 24 Nov 2026), not "[date] title" inside the text. -->
  <time class="home-spotlight-date" [attr.datetime]="article.date.toISOString()">{{ formatD(article.date) }}</time>
  <span class="home-spotlight-headline">{{ article.title }}</span>
  <p class="home-spotlight-text" [innerHTML]="renderedContent()"></p>
  <a
    [routerLink]="
      (navOptions()['content']?.dropdownLinks?.['reactome-research-spotlight']?.link ||
        '/content/reactome-research-spotlight') +
      '/' +
      article.slug
    "
    class="home-spotlight-link"
  >
    Read more →
  </a>
} @else if (failed()) {
  <app-load-error class="home-spotlight-text" what="the research spotlight" />
} @else if (!loading()) {
  <p class="home-spotlight-text">No spotlight to show right now.</p>
}
