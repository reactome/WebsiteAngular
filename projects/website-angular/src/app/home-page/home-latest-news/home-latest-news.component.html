<h1 class="news-title">Latest News</h1>
<ul class="news-list">
  @for (article of newsList; track article) {
    <li class="news-list-option">
      <a
        class="news-link"
        [routerLink]="(navOptions()['about']?.dropdownLinks?.['news']?.link || '/about/news') + '/' + article.slug"
        >{{ formatD(article.date) }} - {{ article.title }}</a
      >
    </li>
  }
</ul>
