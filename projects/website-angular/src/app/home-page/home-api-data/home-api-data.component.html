<h2 class="api-data-header">API and Data Access</h2>
<div class="link-cards">
  <a class="link-card" [href]="navOptions()['tools']?.dropdownLinks?.['content-service']?.link || ''">
    <mat-icon class="link-card-icon" aria-hidden="true">computer</mat-icon>
    <span class="link-card-text">
      <span class="link-card-name">Content Service</span>
      <span class="link-card-what">Pathways, entities and search over REST</span>
    </span>
  </a>
  <a class="link-card" [href]="navOptions()['tools']?.dropdownLinks?.['analysis-service']?.link || ''">
    <mat-icon class="link-card-icon" aria-hidden="true">trending_up</mat-icon>
    <span class="link-card-text">
      <span class="link-card-name">Analysis Service</span>
      <span class="link-card-what">Run analyses from your own code</span>
    </span>
  </a>
  <a class="link-card" [href]="navOptions()['community']?.dropdownLinks?.['icon-library']?.link || ''">
    <mat-icon class="link-card-icon" aria-hidden="true">interests</mat-icon>
    <span class="link-card-text">
      <span class="link-card-name">Icon Library</span>
      <span class="link-card-what">Icons for figures and slides</span>
    </span>
  </a>
  <a
    class="link-card"
    [href]="
      navOptions()['documentation']?.dropdownLinks?.['developers-zone']?.dropdownLinks?.['graph-database']?.link || ''
    "
  >
    <mat-icon class="link-card-icon" aria-hidden="true">storage</mat-icon>
    <span class="link-card-text">
      <span class="link-card-name">Graph Database</span>
      <span class="link-card-what">The whole knowledgebase as a Neo4j graph</span>
    </span>
  </a>
</div>
