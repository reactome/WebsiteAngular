<h2 class="api-data-header">API and Data Access</h2>
<!-- Proposal: a grid, every item visible; no carousel -->
<div class="api-data-container home-grid">
  <a class="api-data-link" [href]="navOptions()['tools']?.dropdownLinks?.['content-service']?.link || ''"
    ><app-button variant="dark" size="large" shape="circle" class="api-data-button">
      <mat-icon class="api-data-icon">computer</mat-icon>
      Content Service
    </app-button></a
  >

  <a class="api-data-link" [href]="navOptions()['tools']?.dropdownLinks?.['analysis-service']?.link || ''"
    ><app-button variant="dark" size="large" shape="circle" class="api-data-button">
      <mat-icon class="api-data-icon">trending_up</mat-icon>
      Analysis Service
    </app-button></a
  >

  <a class="api-data-link" [href]="navOptions()['community']?.dropdownLinks?.['icon-library']?.link || ''"
    ><app-button variant="dark" size="large" shape="circle" class="api-data-button">
      <mat-icon class="api-data-icon">archive</mat-icon>
      Icon Library
    </app-button></a
  >

  <a
    class="api-data-link"
    [href]="
      navOptions()['documentation']?.dropdownLinks?.['developers-zone']?.dropdownLinks?.['graph-database']?.link || ''
    "
    ><app-button variant="dark" size="large" shape="circle" class="api-data-button">
      <mat-icon class="api-data-icon">storage</mat-icon>
      Graph Database
    </app-button></a
  >
</div>
