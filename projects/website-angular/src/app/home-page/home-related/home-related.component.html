<div class="related-wrapper">
  <a
    class="related-link"
    [href]="externalLinks['elixir']?.link || 'https://elixir-europe.org/platforms/data/core-data-resources'"
  >
    <div class="releated-logo-info">
      <img class="related-logo" ngSrc="assets/logo/related/core-data-resources-logo.png" width="360" height="263" />
      <div class="elixir-text">
        <span class="info-text">Reactome is part of the ELIXIR infrastructure</span>
        <span class="info-subtext">Reactome is an Elixir Core Data Resource</span>
      </div>
    </div>
    <span class="learn-more">Learn More ></span>
  </a>
  <a
    class="related-link"
    [href]="externalLinks['gcdr']?.link || 'https://globalbiodata.org/what-we-do/global-core-biodata-resources'"
  >
    <div class="releated-logo-info">
      <img class="related-logo" ngSrc="assets/logo/related/GCBR-Logo-RGB_WcircleBG.png" width="484" height="240" />
      <span class="info-text">Reactome is Global Core Biodata Resource</span>
    </div>
    <span class="learn-more">Learn More ></span>
  </a>
  <a class="related-link" [href]="externalLinks['coretrustseal']?.link || 'https://www.coretrustseal.org/'">
    <div class="releated-logo-info">
      <img class="related-logo" ngSrc="assets/logo/related/CoreTrustSeal-logo.jpg" width="512" height="512" />
      <span class="info-text">Reactome is CoreTrustSeal certified data repository</span>
    </div>
    <span class="learn-more">Learn More ></span>
  </a>
</div>
