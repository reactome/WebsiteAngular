@if (items != {} || null) {
  <aside class="sidebar" [class.collapsed]="!sidebarVisible">
    <button class="sidebar-toggle" (click)="toggleSidebar()" [attr.aria-label]="sidebarVisible ? 'Collapse sidebar' : 'Expand sidebar'">
      <mat-icon class="material-symbols-outlined">
        {{ sidebarVisible ? 'chevron_left' : 'chevron_right' }}
      </mat-icon>
    </button>

    @if (sidebarVisible) {
      <nav class="sidebar-nav" aria-label="Section navigation">
        <div class="sidebar-header">
          @if (sectionIcon) {
            <mat-icon class="material-symbols-outlined section-icon">{{ sectionIcon }}</mat-icon>
          }
          <h2 class="section-title">{{ sectionTitle }}</h2>
        </div>

        <ul class="sidebar-list">
            <li *ngFor="let item of items | keyvalue:preserveOrder" class="sidebar-item" [class.active]="activeItem === item.key">
                <a [routerLink]="item.value.link" class="sidebar-link" routerLinkActive="router-active">
                    {{ item.value.label }}
                </a>
            </li>
        </ul>
      </nav>
    }
  </aside>
}
