<div class="carousel-wrapper">
    <mat-icon [class]="'left-button' + (dark ? ' dark' : ' light')" (click)="scrollLeft()">keyboard_arrow_left</mat-icon>
    <div class="carousel-container" #carouselContainer>
        <ng-content class="carousel-obj"></ng-content>
    </div>
    <mat-icon [class]="'right-button' + (dark ? ' dark' : ' light')" (click)="scrollRight()">keyboard_arrow_right</mat-icon>
</div>
