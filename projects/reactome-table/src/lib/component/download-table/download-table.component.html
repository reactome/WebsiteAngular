@if ((type$ | async) === 'icon') {
  <button
    type="button"
    (click)="saveAFile()"
    color="accent"
    mat-icon-button
    matTooltip="Download the current table data as a csv"
  >
    <mat-icon fontSet="gsa">cloud_download</mat-icon>
  </button>
} @else {
  <button type="button" (click)="saveAFile()" class="primary" mat-stroked-button>Download table</button>
}
