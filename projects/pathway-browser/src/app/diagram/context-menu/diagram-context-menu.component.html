@if (target(); as entity) {
  <div
    #menu
    class="context-menu"
    role="menu"
    [attr.aria-label]="'Actions for ' + entity.label"
    [style.left.px]="position().x"
    [style.top.px]="position().y"
  >
    <p class="context-menu__heading" [title]="entity.label">{{ entity.label }}</p>

    <button #item type="button" role="menuitem" (click)="choose('molecule')" (keydown)="onKeydown($event, 0)">
      Molecule
    </button>
    <button #item type="button" role="menuitem" (click)="choose('pathways')" (keydown)="onKeydown($event, 1)">
      Pathways
    </button>
    <button #item type="button" role="menuitem" (click)="choose('interactors')" (keydown)="onKeydown($event, 2)">
      Interactors
    </button>
  </div>
}
