@if (failed()) {
  <p class="padding">The Expression Atlas widget could not be loaded, so there is no heatmap to show.</p>
} @else if (empty()) {
  <p class="padding">This entry has no genes with expression data.</p>
}
<!-- Hidden, not removed, when there is nothing to draw: the widget renders into
     it, and the last selection's heatmap stayed under "no genes". -->
<div id="expressionContainer" class="padding" [hidden]="failed() || empty()"></div>
