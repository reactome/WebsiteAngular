<ng-template #label>
  @if (titleCase()) {
    {{ name() | titlecase }}
  } @else {
    {{ name() }}
  }

  @if (displayId()) {
    ({{ databaseName() ? databaseName() + ':' : '' }}{{ id() }})
  }
</ng-template>

@if (url(); as href) {
  <a [href]="href" target="_blank" [matTooltip]="term().definition">
    <ng-container [ngTemplateOutlet]="label" />
  </a>
} @else {
  <span [matTooltip]="term().definition">
    <ng-container [ngTemplateOutlet]="label" />
  </span>
}
