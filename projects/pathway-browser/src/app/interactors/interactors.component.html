<ng-template #dividerTemplate let-text>
  <div class="divider-container">
    <div class="line">
      <mat-divider class="divider"></mat-divider>
    </div>
    <div class="text">{{ text }}</div>
    <div class="line">
      <mat-divider class="divider"></mat-divider>
    </div>
  </div>
</ng-template>

<div id="interactor-container" class="variables">
  <mat-card class="card">
    <mat-card-content>
      <div class="button-container">
        <button
          mat-raised-button
          class="raised-full-width-button"
          [disabled]="hasEHLD()"
          (click)="clearInteractors()"
          [ngClass]="{ 'active-button': clear }"
        >
          <mat-icon [ngClass]="{ 'active-icon': clear }" color="primary">clear</mat-icon>
          Clear overlays
        </button>
      </div>

      <!--Using $implicit allows you to pass a value into a template without explicitly naming the context variable-->
      <ng-container *ngTemplateOutlet="dividerTemplate; context: { $implicit: 'Main' }"></ng-container>

      <div class="main-resource">
        <button
          class="full-width"
          mat-button
          [disabled]="hasEHLD()"
          (click)="getInteractors(INTACT_RESOURCE)"
          [ngClass]="{ 'active-button': currentResource().type === ResourceType.STATIC }"
        >
          <!--
            IntAct carries the same count as the others. It is the resource a
            reader lands on and the one most of them use, so leaving it the only
            unlabelled button meant the count looked like a PSICQUIC curiosity
            rather than the answer to "is there anything here".
          -->
          <div class="resource-name">
            <span>IntAct</span>
            @if (tallyFor(INTACT_RESOURCE); as tally) {
              <span class="resource-count" [class.none]="tally.interactions === 0" [title]="describeTally(tally)">
                {{ tally.interactions }}
              </span>
            }
          </div>
        </button>

        <!-- DisGeNet is deliberately not offered. Its overlay service 404s on both
             dev and production -- DisGeNET moved to a commercial licence -- so the
             button could only ever fail, and the resource is not being ported to
             this site. The service-side plumbing is left in place in case that
             decision is revisited. -->
      </div>

      <!--
        Not gated on the fetch. Hiding the whole grid while one resource loaded
        made every button disappear and come back, and meant the spinner below
        could never be seen: it lives inside the thing that was being hidden.
      -->
      @if (psicquicResources.length > 0) {
        <ng-container *ngTemplateOutlet="dividerTemplate; context: { $implicit: 'PSICQUIC' }"></ng-container>

        <mat-grid-list cols="2" rowHeight="28px" [gutterSize]="'5px'">
          @for (resource of psicquicResources; track resource) {
            <mat-grid-tile class="rounded-corner">
              <button
                class="full-width psicquic-button"
                mat-button
                [disabled]="hasEHLD() || (!!loadingResource && loadingResource !== resource.name)"
                (click)="getInteractors(resource.name)"
                [ngClass]="{ 'active-button': currentResource().name === resource.name }"
              >
                <div class="resource-name">
                  <span>{{ resource.name }}</span>
                  <!--
                    What this resource held last time it was asked, for this
                    diagram. Thirteen live resources look identical otherwise, and
                    the only way to tell them apart is to try each one.

                    Interactions, not entities -- the same unit the badge on an
                    entity counts. Counting entities here made Reactome-FIs read
                    "15" beside an MCM7 badge reading "17", which is impossible
                    unless the two numbers mean different things, and nothing on
                    screen said they did.
                  -->
                  @if (tallyFor(resource.name); as tally) {
                    <span class="resource-count" [class.none]="tally.interactions === 0" [title]="describeTally(tally)">
                      {{ tally.interactions }}
                    </span>
                  }
                  @if (loadingResource === resource.name) {
                    <mat-spinner class="spinner-color" diameter="20"></mat-spinner>
                  }
                </div>
              </button>
            </mat-grid-tile>
          }
        </mat-grid-list>
      }

      <ng-container *ngTemplateOutlet="dividerTemplate; context: { $implicit: 'Custom' }"></ng-container>

      @if (resourceTokens.length != 0) {
        <mat-selection-list [multiple]="false" hideSingleSelectionIndicator="true">
          @for (resourceToken of resourceTokens; track resourceToken) {
            <mat-list-option
              [value]="resourceToken"
              [selected]="isSelected(resourceToken)"
              (click)="getInteractors(resourceToken)"
              [ngClass]="{ 'active-button': currentResource().name === resourceToken.summary.name }"
              class="full-width"
            >
              <div class="resource-name surface-variant">
                <div>{{ resourceToken.summary.name }}</div>
                <button mat-icon-button [disabled]="hasEHLD()" (click)="deleteCustomResource(resourceToken)">
                  <mat-icon>delete</mat-icon>
                </button>
              </div>
            </mat-list-option>
          }
        </mat-selection-list>
      }

      <div class="button-container">
        <button
          mat-raised-button
          class="raised-full-width-button"
          [disabled]="hasEHLD()"
          (click)="openCustomInteractorDialog()"
        >
          <mat-icon color="primary">add</mat-icon>
          Add overlay resource
        </button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
