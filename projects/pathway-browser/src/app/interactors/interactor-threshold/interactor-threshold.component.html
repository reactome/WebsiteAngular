<label class="threshold-label" for="interactor-threshold">
  Interaction confidence
  <span class="threshold-value">{{ label() }}</span>
</label>

<mat-slider class="threshold-slider" [min]="0" [max]="1" [step]="0.01" [discrete]="true">
  <input id="interactor-threshold" matSliderThumb [value]="threshold()" (valueChange)="set($event)" />
</mat-slider>

@if (tally(); as tally) {
  <span class="threshold-tally" title="The diagram draws the best supported first, and has room for 18">
    {{ tally }} shown
  </span>
}

@if (hiddenByThreshold()) {
  <span class="threshold-empty"> The threshold is hiding every interactor here. Lower it to bring them back. </span>
}
