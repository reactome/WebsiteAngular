<div class="container">
  <mat-tab-group [selectedIndex]="selectedTabIndex()">
    <mat-tab>
      <ng-template mat-tab-label>
        <div class="analysis-type-header">
          <div class="analysis-type-icon" [innerHTML]="qualitative | async | safe: 'html' : true"></div>
          <div class="analysis-type-label">
            <strong class="kind">Qualitative</strong>
            <span class="normal">Pathway Enrichment</span>
          </div>
        </div>
      </ng-template>
      <cr-qualitative-analysis (closed)="closed.emit($event)" [status]="status()" />
    </mat-tab>
    @if (!isCurator) {
      <mat-tab>
        <ng-template mat-tab-label>
          <div class="analysis-type-header">
            <div class="analysis-type-icon" [innerHTML]="quantitative | async | safe: 'html' : true"></div>
            <div class="analysis-type-label">
              <strong class="kind">Quantitative</strong>
              <span class="normal">Pathway Enrichment</span>
            </div>
          </div>
        </ng-template>
        <cr-quantitative-analysis (closed)="closed.emit($event)" [status]="status()" />
      </mat-tab>
    }
    <mat-tab>
      <ng-template mat-tab-label>
        <div class="analysis-type-header">
          <div class="analysis-type-icon" [innerHTML]="species | async | safe: 'html' : true"></div>
          <div class="analysis-type-label">
            <strong class="kind">Species</strong>
            <span class="normal">Pathway Enrichment</span>
          </div>
        </div>
      </ng-template>
      <cr-species-analysis (closed)="closed.emit($event)" [status]="status()" />
    </mat-tab>
    <mat-tab>
      <ng-template mat-tab-label>
        <div class="analysis-type-header">
          <div class="analysis-type-icon" [innerHTML]="tissue | async | safe: 'html' : true"></div>
          <div class="analysis-type-label">
            <strong class="kind">Tissue</strong>
            <span class="normal">Pathway Enrichment</span>
          </div>
        </div>
      </ng-template>
      <cr-tissue-analysis (closed)="closed.emit($event)" [status]="status()" />
    </mat-tab>
  </mat-tab-group>
</div>
