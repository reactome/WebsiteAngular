@if (reactionId(); as reaction) {
  <cr-reaction-diagram [stId]="reaction" />
} @else if (pathwayId()) {
  @if (loading()) {
    <!-- nothing: the caller waits on data-render-ready, not on markup -->
  } @else if (hasEHLD()) {
    <cr-ehld [(pathwayId)]="pathwayId" />
  } @else {
    <cr-diagram [(pathwayId)]="pathwayId" />
  }
} @else {
  <cr-reacfoam />
}
