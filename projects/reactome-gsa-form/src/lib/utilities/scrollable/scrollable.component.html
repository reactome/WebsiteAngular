<div
  #scrollable
  (scroll)="scrolling()"
  cdkScrollable
  [class]="{
    'overflow-hide': tourVisible | async,
    'tour-active': tour.on,
    'small-screen': (height.medium$ | async) !== true,
  }"
  id="scroll-container-{{ name() }}"
  class="center-vertical width-hundred relative flex-container align-center justify-center scrollbar fill-height"
>
  <div class="flex-container vertical justify-center align-center width-98" [class]="innerClasses()">
    @if (shadows.top()) {
      <div class="shadow shadow-top width-hundred"></div>
    }
    <ng-content></ng-content>
    @if (shadows.bottom()) {
      <div class="shadow shadow-bottom width-hundred"></div>
    }
  </div>
</div>
