# Loopback only, and on the host's network: Spring's default address is 0.0.0.0 (spec 015 T063).
server.address=127.0.0.1
server.port=4360
spring.main.banner-mode=off
logging.level.org.neo4j=WARN
logging.level.org.springframework.data.neo4j=WARN
# graph-core's LazyFetchAspect is both a scanned component and its config's @Bean (the aspect's own instance, which
# is the one that must be wired): ContentService allows the override for the same reason.
spring.main.allow-bean-definition-overriding=true
