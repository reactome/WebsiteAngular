# Bot blocking for beta.reactome.org (development deployment).
#
# Include from the vhost, or drop into sites-common and Include it:
#   Include /etc/apache2/sites-common/beta-bot-blocks.conf
#
# WHY THIS IS MORE AGGRESSIVE THAN PROD
#
# Production wants Googlebot and Bingbot: it needs to be indexed. This host does
# not -- it is a development deployment with a single user, fronted by a Tomcat
# whose 6 GB heap fills within minutes when something walks the pathway URLs.
# Each of those URLs is a Neo4j query. So here the default is "no automation at
# all" rather than "no *bad* automation", which is a much easier rule to keep
# correct than a list of names that grows every month.
#
# NOTE ON IP RULES: this host sits behind Cloudflare, so every request arrives
# from a Cloudflare address. `Require not ip` and %{REMOTE_ADDR} therefore match
# Cloudflare, not the client -- they block nothing or everything. Only header
# matching (User-Agent below) is reliable until mod_remoteip is configured with
# Cloudflare's ranges; see the bottom of this file.

<IfModule mod_rewrite.c>
  RewriteEngine On

  # --- 1. Named AI and SEO crawlers -------------------------------------
  # Same list as prod, kept in sync deliberately; add here and there together.
  RewriteCond %{HTTP_USER_AGENT} (Amzn-SearchBot|Amazonbot|PetalBot|AhrefsBot|SemrushBot|DataForSeo|MJ12bot|DotBot|CCBot|Barkrowler|Bytespider|GPTBot|ClaudeBot|Claude-Web|anthropic-ai|PerplexityBot|Bytedance|SeekportBot|serpstatbot|ZoominfoBot|Diffbot|ImagesiftBot|Timpibot|Omgilibot|meta-externalagent|Applebot-Extended) [NC]
  RewriteRule ^ - [F]

  # --- 2. Anything self-identifying as automation -----------------------
  # Safe here precisely because this host must not be indexed. Do NOT copy this
  # rule to production: it blocks Googlebot and Bingbot along with the rest.
  # CUBOT is an Android phone brand, so its UA contains "bot" -- excluded first,
  # because a rule that blocks a real device is worse than one that misses a
  # crawler. Word boundaries are not an option here: nearly every crawler is
  # "<something>bot", so \bbot\b would match almost none of them.
  RewriteCond %{HTTP_USER_AGENT} !CUBOT [NC]
  RewriteCond %{HTTP_USER_AGENT} (bot|crawler|crawling|spider|scraper|fetcher|archiver|indexer) [NC]
  RewriteRule ^ - [F]

  # --- 3. Scripted clients ----------------------------------------------
  # curl and wget are deliberately absent: they are how the host itself is
  # checked from outside, and a blocked health check is worse than a scraped one.
  RewriteCond %{HTTP_USER_AGENT} (python-requests|python-urllib|aiohttp|httpx|Go-http-client|Java/|okhttp|libwww-perl|Scrapy|node-fetch|axios) [NC]
  RewriteRule ^ - [F]

  # --- 4. No user agent at all ------------------------------------------
  # Browsers always send one. Nothing legitimate here does not.
  RewriteCond %{HTTP_USER_AGENT} ^$
  RewriteRule ^ - [F]

  # --- 5. The distributed-scraper signature from the prod incident -------
  # Old Chrome 125 on "Mac OS X 10_15_7" across many IPs. Kept commented: it can
  # catch a real Chrome-125 Mac user, so enable it only while a flood is running
  # and remove it afterwards.
  # RewriteCond %{HTTP_USER_AGENT} "Intel Mac OS X 10_15_7" [NC]
  # RewriteCond %{HTTP_USER_AGENT} "Chrome/125\.0\.0\.0 Safari" [NC]
  # RewriteRule ^ - [F]

  # --- 6. The expensive endpoints ---------------------------------------
  # These are the ones that turn into large graph queries. Nothing that reaches
  # here should be hitting them without a browser session, and it is cheaper to
  # refuse at Apache than to let Tomcat allocate for it.
  RewriteCond %{REQUEST_URI} ^/(ContentService|AnalysisService)/ [NC]
  RewriteCond %{HTTP_USER_AGENT} (bot|crawler|spider|scraper|python|Java/|Go-http-client) [NC]
  RewriteRule ^ - [F]
</IfModule>

# --- 7. Restore real client IPs ------------------------------------------
# Without this every log line and every IP-based rule sees Cloudflare. With it,
# %{REMOTE_ADDR} and the access log show the actual client, and IP blocking
# becomes possible at all. Ranges from https://www.cloudflare.com/ips/ -- they
# change occasionally, so refresh them when Cloudflare announces it.
#
#   a2enmod remoteip && systemctl reload apache2
#
# <IfModule mod_remoteip.c>
#   RemoteIPHeader CF-Connecting-IP
#   RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22
#   RemoteIPTrustedProxy 103.31.4.0/22 141.101.64.0/18 108.162.192.0/18
#   RemoteIPTrustedProxy 190.93.240.0/20 188.114.96.0/20 197.234.240.0/22
#   RemoteIPTrustedProxy 198.41.128.0/17 162.158.0.0/15 104.16.0.0/13
#   RemoteIPTrustedProxy 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
#   RemoteIPTrustedProxy 2400:cb00::/32 2606:4700::/32 2803:f800::/32
#   RemoteIPTrustedProxy 2405:b500::/32 2405:8100::/32 2a06:98c0::/29
#   RemoteIPTrustedProxy 2c0f:f248::/32
#   # And switch the log format so it records the restored address:
#   #   LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" cloudflare
#   #   CustomLog ${APACHE_LOG_DIR}/access.log cloudflare
# </IfModule>
