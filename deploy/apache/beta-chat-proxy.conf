# Routes beta.reactome.org/chat to the React-to-Me chatbot container.
#
# This file is Included near the TOP of each beta vhost, before the catch-all
# that sends everything else to the Angular server on :4200. Apache evaluates
# ProxyPass rules in the order they appear, so if this were included at the
# bottom (where beta-bot-blocks.conf goes) the catch-all would win and /chat
# would keep rendering the Angular wildcard route instead.
#
# Requires: sudo a2enmod proxy proxy_http proxy_wstunnel rewrite

<IfModule proxy_module>
  # This is a reverse proxy only; never act as an open forward proxy.
  ProxyRequests Off
  ProxyPreserveHost On

  # Chainlit carries chat traffic over socket.io, which upgrades to a websocket.
  # A plain ProxyPass renders the UI and then hangs with no replies, so the
  # upgrade has to be matched first and handed to ws:// via proxy_wstunnel.
  <IfModule rewrite_module>
    RewriteEngine On

    # Bare /chat -> /chat/ , which is what production does. This has to be a
    # RewriteRule rather than a RedirectMatch: mod_proxy claims the URL during
    # translate_name before mod_alias runs, so the vhost's catch-all ProxyPass
    # was answering /chat with the Angular app and the redirect never fired.
    RewriteRule ^/?chat$ /chat/ [R=302,L]

    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?chat/(.*)$ ws://127.0.0.1:8000/chat/$1 [P,L]
  </IfModule>

  # Trailing slash only, so this cannot also swallow a future /chatroom.

  # retry=0: after a container restart, do not blackhole the backend for 60s.
  ProxyPass        /chat/ http://127.0.0.1:8000/chat/ retry=0
  ProxyPassReverse /chat/ http://127.0.0.1:8000/chat/
</IfModule>
