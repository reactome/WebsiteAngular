# The website on your own machine.
#
# No TLS, no Cloudflare, no bot blocking, no rate limiting, and the Tina admin is
# reachable — because none of those protect anything here and every one of them
# is an obstacle to the thing this exists for: someone being able to start the
# site and look at it.
#
# Upstreams are compose service names. Change them here and nowhere else.

upstream site {
    server app:4200;
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone. Tomcat's keepAliveTimeout
    # defaults to 20s, so 10s here leaves room.
    keepalive          32;
    keepalive_timeout  10s;
    keepalive_requests 1000;
}
upstream content {
    server content-service:8080;   # Tomcat today, node later
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone. Tomcat's keepAliveTimeout
    # defaults to 20s, so 10s here leaves room.
    keepalive          32;
    keepalive_timeout  10s;
    keepalive_requests 1000;
}
upstream analysis {
    server content-service:8080;
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone. Tomcat's keepAliveTimeout
    # defaults to 20s, so 10s here leaves room.
    keepalive          32;
    keepalive_timeout  10s;
    keepalive_requests 1000;
}

include /etc/nginx/common/websocket.conf;

# Docker's internal DNS. Needed because the two optional services below are
# resolved per request rather than at startup.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name localhost;

    # The Tina admin is reachable here, and deliberately so: editing content is
    # the point of running locally. Every deployed environment denies it.
    location ~ ^/admin(/|$) {
        include /etc/nginx/common/upstream-proxy.conf;
        proxy_pass http://site;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # DeltaSignal and the chatbot are optional here: someone starting the site
    # to look at a pathway should not need a Julia solver and a chat service
    # running as well.
    #
    # Resolved through a variable, per request, so nginx starts whether or not
    # they exist. Named directly in an upstream block they would be resolved at
    # startup, and a missing one stops nginx entirely -- the whole site refusing
    # to start because a service nobody asked for is absent.
    location /api/ {
        include /etc/nginx/common/upstream-proxy.conf;
        set $deltasignal_upstream deltasignal:8080;
        proxy_pass http://$deltasignal_upstream/api/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /chat { return 302 /chat/; }
    location /chat/ {
        include /etc/nginx/common/upstream-proxy.conf;
        set $chatbot_upstream chatbot:8000;
        proxy_pass http://$chatbot_upstream/chat/;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    include /etc/nginx/common/routes-core.conf;
}
