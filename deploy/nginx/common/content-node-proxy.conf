# How every location node answers is proxied: the shared headers, the node
# upstream, and Java's timeouts. Without the last, node's locations inherited
# nginx's 60s where /ContentService/ has 300s, so a request Java would answer --
# several 30s-capped reads in one handler -- became nginx's 504 while node went
# on querying for a client that had gone.
include /etc/nginx/common/upstream-proxy.conf;
proxy_pass http://content_node;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
