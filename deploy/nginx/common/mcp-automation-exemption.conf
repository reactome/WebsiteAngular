# The one path on these hosts that automation is supposed to reach.
#
# `block-all-automation.conf` refuses anything self-identifying as a machine,
# which is right for a host that must not be indexed and wrong for exactly one
# route. An MCP server is only ever spoken to by a program: the official SDKs
# use httpx (Python) and undici/node-fetch (Node), and `python-requests`,
# `httpx`, `aiohttp`, `node-fetch`, `axios`, `Go-http-client`, `Java/` and
# `okhttp` are all on that list. So /mcp was published and simultaneously
# refused to every real client of it.
#
# Found by driving a session over the public URL rather than by reading the
# rules: a browser user agent got 200 and Python's got 403, on the same request.
#
# Two chained maps rather than a second `if` beside the first, because the
# enforcement stays in one place. A rule that is turned off somewhere else is
# how the same condition ends up with two answers.
#
# What this does NOT relax: the route keeps its own 2r/s limit and its 256 KB
# body cap, which are the bounds that actually matter for an endpoint whose
# calls cost real work. This only stops the host's blanket "no machines"
# refusal from applying to the one path whose entire purpose is machines.
map $uri $mcp_path {
    default 0;
    "~^/mcp" 1;
}

map "$mcp_path$blocked_automation" $blocked_automation_enforced {
    default 0;
    # Not the MCP path, and self-identifying as automation.
    "01" 1;
}
