# The routes every environment shares, a local machine included. Deployed
# environments include routes.conf, which includes this and adds what a local
# machine may not run or need: DeltaSignal, the chatbot, the MCP server, the
# render service, and the rate-limited exporters (their zones are defined by
# the deployed environments). local.conf includes this and defines DeltaSignal
# and the chatbot itself, resolved per request so a missing service does not
# stop nginx from starting.
#
# One copy of each route. routes.conf used to repeat these instead of including
# them, and the content-node routes went into that copy only -- so local compose
# sent them to Java while every other setup sent them to node (#389).
#
# Upstreams are named, not addressed: each environment file defines `site`,
# `content`, `analysis`, `deltasignal` and `chatbot` to suit itself — localhost
# ports on a host, service names in compose, and something else again when node
# in this repository takes over what Tomcat serves.
#
# What is NOT here is anything that differs by environment: bot blocking, rate
# limiting, TLS, and the Tina admin all live in the environment files, because
# getting one of them wrong in the wrong place is the expensive kind of mistake.
#
# The admin rule in particular is deliberately repeated in each environment
# rather than shared. nginx cannot choose an include by variable, and the
# workaround would have hidden the one decision that must be obvious at a glance:
# whether a CMS editor is reachable from the internet.
#
# Every literal segment of a node route takes a matrix parameter -- the
# `(;[^/]*)?` after each word -- because Spring cuts one from every segment
# before it matches a path: `/data;jsessionid=x/diseases` is `/data/diseases`
# to Java. A route without it sent such a request to Tomcat, and would send it
# nowhere once Tomcat is off. A path variable's `[^/]+` takes one already, and
# node reads the path as Java does. A regex with `;` in it is quoted, or nginx
# reads the `;` as the end of the directive. deploy/nginx/routes.spec.ts puts
# one on each segment of every URL it knows and checks it goes where the
# plain URL goes, in nginx and the dev proxy alike. Spec 006 T008.

# The endpoints the node port serves (tools/content-node). A regex location
# wins over the /ContentService/ prefix below, as an exact one did.
#
# These three are every path Java exposes under /data/content/, so a prefix
# would work today. Still named individually: a prefix would silently claim the
# next endpoint Java adds and turn a working page into a 404, and three lines
# are a cheap price for a route that cannot acquire new meaning on its own.
#
# Byte-identical to Java bar two declared differences, both written down beside
# the code that makes them: a subpathway's DOI, which ContentPageManager
# discards by passing null into TocSubpathway, and the order of the contributors
# array, which the page sorts client-side before anyone sees it. See specs/006
# D11, D12 and D15. All three lists are held in memory and answer in ~4ms.
#
# To fall back: delete the block for that endpoint. Java answers again with the
# next reload, and the client-side join in the contents page still covers the
# DOIs.
location ~ "^/ContentService/data(;[^/]*)?/content(;[^/]*)?/toc(;[^/]*)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

location ~ "^/ContentService/data(;[^/]*)?/content(;[^/]*)?/doi(;[^/]*)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

location ~ "^/ContentService/data(;[^/]*)?/content(;[^/]*)?/contributors(;[^/]*)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# The species lists, byte-identical to Java and verified by the diff harness
# over the whole corpus rather than by eye.
#
# Exact matches for the same reason as the three above, and a sharper one here:
# Java serves other shapes under /data/species/ that node does not, so a prefix
# would claim them and 404 what works today.
location ~ "^/ContentService/data(;[^/]*)?/species(;[^/]*)?/main(;[^/]*)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

location ~ "^/ContentService/data(;[^/]*)?/species(;[^/]*)?/all(;[^/]*)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# An object with everything around it, for the Pathway Browser's details panel
# and the website's detail pages: graph-core's findEnhancedObjectById, written
# by the domain serialiser, and a reference entity -- when asked to summarise --
# as the content service's SummaryEntity, rebuilt in node. Byte-identical to
# Java in the default view; in the nested views (the site's), identical as
# data, the getter-only key order being the JVM's of the day.
location ~ "^/ContentService/data(;[^/]*)?/query(;[^/]*)?/enhanced(;[^/]*)?/v2(;[^/]*)?/[^/]+/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# An object with its neighbours, their species, and their regulations,
# references and markers one step further: graph-core's
# findOldEnhancedObjectById, written by the domain serialiser. The entity
# popup, the website's content pages and the IDG panel read it. Byte-identical
# to Java over
# 6,000 objects of every class.
location ~ "^/ContentService/data(;[^/]*)?/query(;[^/]*)?/enhanced(;[^/]*)?/[^/]+/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# An entity or an event and everything below it (graph-core's get...InDepth),
# which the Pathway Browser's object tree reads with JSOG in the
# nested-aggregated view. Byte-identical to Java over 1,229 requests: 529
# entities and 300 pathways, with the site's parameters, the defaults and
# deeper maxDepth. `attributes` must be relationship type names: Java writes it
# into its query text unchecked, node refuses anything else.
location ~ "^/ContentService/data(;[^/]*)?/(entity(;[^/]*)?|event(;[^/]*)?)/[^/]+/in-depth(;[^/]*)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# An event's or entity's counterpart in another species, one id by GET or up
# to twenty by POST (graph-core's OrthologyService), written by the domain
# serialiser; the POST's map in the order Java's HashMap writes it. The
# Pathway Browser asks both when the species is changed. Byte-identical to
# Java, errors included -- bar '.', which is not found here and Java's 500.
location ~ "^/ContentService/data(;[^/]*)?/(orthology(;[^/]*)?/[^/]+/species(;[^/]*)?|orthologies(;[^/]*)?/ids(;[^/]*)?/species(;[^/]*)?)/[^/]+/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# An accession's interactors from IntAct: the entity popup's list, the
# interactor tables' enhanced rows, the interactor page's rows with their
# Reactome entities, and the POST the diagram sends for every protein in it.
# Java's Cypher as written, so equal scores keep Java's order; byte-identical
# over 54 requests, errors and paging included. Also how many interactors an
# accession has (/summary, and the POST for many, in Java's HashMap order)
# and the pathways its interactors are in (/pathways, by species name):
# byte-identical over 28 more. The other interactor endpoints -- PSICQUIC
# queries, uploads, tokens -- stay with Java.
location ~ "^/ContentService/interactors(;[^/]*)?/static(;[^/]*)?/molecule(;[^/]*)?/((enhanced(;[^/]*)?/)?[^/]+/details(;[^/]*)?|[^/]+/(withEntities(;[^/]*)?|summary(;[^/]*)?|pathways(;[^/]*)?))/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

location ~ "^/ContentService/interactors(;[^/]*)?/static(;[^/]*)?/molecules(;[^/]*)?/(details(;[^/]*)?|summary(;[^/]*)?)/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# The PSICQUIC services interactors can be drawn from: the HUPO-PSI
# registry's list, re-read every five minutes and sorted by name, as
# content-service keeps it. Byte-identical to Java.
location ~ "^/ContentService/interactors(;[^/]*)?/psicquic(;[^/]*)?/resources(;[^/]*)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# The search box's completions and its "did you mean": the collations Solr's
# own /suggest and /spellcheck handlers offer, each kept if /exists finds it,
# as search-core does. Byte-identical to Java over the queries tried, its 400
# included; a failing Solr is Java's 500 envelope with a shorter message.
# The rest of /ContentService/search stays with Java.
location ~ "^/ContentService/search(;[^/]*)?/(suggest(;[^/]*)?|spellcheck(;[^/]*)?)/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# The facets of everything (the search page, before a search) and of the icon
# library, counted by Solr's /facetall and /icon/facet handlers and written
# as search-core's FacetMapping. Byte-identical to Java.
location ~ "^/ContentService/search(;[^/]*)?/(facet(;[^/]*)?|icon(;[^/]*)?/facet(;[^/]*)?)/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# The facets of a query, filtered by species, types, keywords and
# compartments (the search page, with every search): Solr's /facet handler
# asked as search-core asks it, a filter that selects nothing dropped and
# Solr asked again unless filters are forced. Byte-identical to Java,
# Spring's parameter errors included.
location ~ "^/ContentService/search(;[^/]*)?/facet_query(;[^/]*)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# The icon library: a page of icons by name, in a category or matching a
# text, and one icon by its stable id -- search-core's Entry built from
# Solr's documents, highlighting included. Byte-identical to Java over the
# whole library; when Solr refuses a request, the 500's message is shorter
# than Java's, which repeats Solr's own error.
location ~ "^/ContentService/search(;[^/]*)?/icon(;[^/]*)?/[^/]+/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# Search within a diagram (the Pathway Browser's search box), where an object
# occurs in a diagram, and the summary of both: Solr's /diagrams,
# /diagrams/occurrences and /fireworks handlers, after Java's checks of the
# identifiers against the graph. Byte-identical to Java over fifteen cases,
# its 400s and 404s included.
location ~ "^/ContentService/search(;[^/]*)?/diagram(;[^/]*)?/[^/]+(/occurrences(;[^/]*)?/[^/]+)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# Flagging a term in the diagram on screen, or across the species overview
# (the Pathway Browser's flag): Solr's /diagrams/flagging and
# /fireworks/flagging folded as content-service's SearchManager folds them,
# each set in java.util.HashSet's order. Byte-identical to Java over twelve
# cases, its 400s and 404s included.
location ~ "^/ContentService/search(;[^/]*)?/(diagram(;[^/]*)?/[^/]+/flag(;[^/]*)?|fireworks(;[^/]*)?/flag(;[^/]*)?)/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# The diagrams an entity is in (the Pathway Browser's search results): its
# occurrences from Solr's /get by dbId, then those diagrams' documents by
# stable id, with only the fields asked for. Byte-identical to Java over
# twelve cases, Spring's parameter errors included.
location ~ "^/ContentService/search(;[^/]*)?/pathways(;[^/]*)?/of(;[^/]*)?/[^/]+/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# The species-wide search behind the Pathway Browser's "All pathways" results
# and its FoamTree (the path keeps the old widget's name): Solr's /fireworks
# handler for the species and the entries without one. Finding nothing, it
# names the terms Reactome could annotate (Solr's target core) and reports
# the search to the report service, as Java does. Byte-identical to Java
# over eight cases, its 400, 404 and 500 included.
location ~ "^/ContentService/search(;[^/]*)?/fireworks(;[^/]*)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# The website's search, grouped by type or not, by row or by page: search-core's
# fallback chain (without the filters, among the deleted, by dismax, in every
# scope), then Solr's /search/grouped or /search. Finding nothing, it names the
# terms Reactome could annotate and reports the search, as Java does.
# Byte-identical to Java over fifteen cases, errors and 404s included.
location ~ "^/ContentService/search(;[^/]*)?/query(;[^/]*)?(/paginated(;[^/]*)?)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# The Pathway Browser's "cite this": a pathway's citation (its authors,
# release and DOI, as content-service's EventCitation writes them), a paper's
# by PubMed id from Europe PMC, and either as a BibTeX, RIS or text download.
# Byte-identical to Java over eleven cases.
location ~ "^/ContentService/citation(;[^/]*)?/(pathway(;[^/]*)?/[^/]+|static(;[^/]*)?/[^/]+|export(;[^/]*)?)/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# What points at an object (the website's detail pages): graph-core's
# getReferralsTo -- everything referring to it but edit history, and for a
# species, compartment, database, evidence type or review status not all
# that carries it -- grouped by relationship,
# each a simple object. Byte-identical to Java over nine cases, old REACT_
# ids, dbIds with a version, and its 404 included.
location ~ "^/ContentService/data(;[^/]*)?/instance(;[^/]*)?/[^/]+/referrers(;[^/]*)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# A person, by dbId or ORCID, and the publications they authored (by dbId,
# ORCID or e-mail address), written by the domain serialiser in each of Java's
# views. Java matches the person by a property no index serves -- 1.1s by dbId;
# node matches the same node by its indexed dbId. The person is byte-identical
# to Java's; the publications are Java's set in its by-ORCID order, which by
# dbId Java itself reverses. Every other attribute under /person/{id}/ is
# answered as /data/query/{id}/{attributeName} answers one, the person loaded
# as PersonService.findPerson loads them: byte-identical to Java over every
# Person getter. The person page's four lists (authored and reviewed
# pathways and reactions) come here too, with one declared difference that
# fixes a bug: Java returns an event once per authorship edit, so a reaction
# edited twice by the same person appeared twice; node returns each event once.
location ~ "^/ContentService/data(;[^/]*)?/person(;[^/]*)?/[^/]+(/[^/]+)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# The release number and database name, and a species' top-level pathways --
# the first endpoints ported (specs/006) and byte-identical to Java since, but
# never switched over until now: they were still reaching Tomcat. The release
# number is asked on every page load and node holds it in memory, so restart
# content-node when the database changes (see the cached() note in service.mjs).
# /pathways/top/{species}/curated and /database/info stay with Java.
location ~ "^/ContentService/data(;[^/]*)?/database(;[^/]*)?/(version(;[^/]*)?|name(;[^/]*)?)/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}
location ~ "^/ContentService/data(;[^/]*)?/pathways(;[^/]*)?/top(;[^/]*)?/[^/]+/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# One object with everything it points to: graph-core's findById(id,
# OUTGOING) as Java's Jackson writes it, in each of the views Java's converter
# offers (?view=nested|nested-aggregated, ?includeRef=true). The model is read
# from the deployed graph-core by snapshot-domain.mjs, not restated. Only the
# plain path: /query/{id}/{attribute} and /query/enhanced|abridged/{id} are
# other endpoints. Byte-identical to Java over a corpus of 20,000 objects of
# every class, bar the order of a few getter-only properties in the nested
# views, which Java itself does not keep from one start to the next.
# Including POST /query/ids, a batch of objects by id, and its map form
# below: node answers both, and a GET of either as Java does.
location ~ "^/ContentService/data(;[^/]*)?/query(;[^/]*)?/[^/]+/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}
# Quoted: unquoted, nginx reads the ';' as the end of the directive.
location ~ "^/ContentService/data(;[^/]*)?/query(;[^/]*)?/ids(;[^/]*)?/map(;[^/]*)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# Every disease: the objects as graph-core reads a class (nodes alone, by
# displayName), and the tab-separated DOID list. Byte-identical to Java.
location ~ "^/ContentService/data(;[^/]*)?/diseases(;[^/]*)?(/doid(;[^/]*)?)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# One attribute of an object, as Java's tab-separated text: every attribute
# under /data/query/{id}/{attributeName}, in any case. The object as Java's
# findById loads it, its getter found by name and called as graph-core's do
# -- what LazyFetchAspect would load included -- and toTSV's text of it, a
# summation's through an emulation of Jsoup that matches Jsoup on every
# summation in the graph. stId and normalPathway keep their own lighter
# queries. Byte-identical to Java over every getter of up to three objects of
# each of 82 classes, from few relationships to 200 (5,793 requests), and the
# id forms -- versions, REACT_ ids,
# dbIds, a ';' matrix parameter -- bar a 404 body's `url`, which names the
# service that answered (the same declared difference as /pathways/top/{id}).
# `abridged` and `enhanced` are not ids, nor `more` an attribute: Java's
# more specific /query/abridged/{id}, /query/enhanced/{id} and
# /query/{id}/more take those paths.
location ~ "^/ContentService/data(;[^/]*)?/query(;[^/]*)?/(?!(abridged(;[^/]*)?|enhanced(;[^/]*)?)/)[^/]+/(?!more(;[^/]*)?/?$)[^/]+/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# Every route from an event up to a top-level pathway, which the Pathway
# Browser asks for on every pathway it opens. Java's query, kept; the id read
# as /data/query/{id}/stId reads it. Byte-identical to Java over 25 ids --
# events reached by up to ten routes, top-level pathways, REACT_ and versioned
# ids, non-events -- bar a 404 body's `url`, as above.
location ~ "^/ContentService/data(;[^/]*)?/event(;[^/]*)?/[^/]+/ancestors(;[^/]*)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# The lower-level pathways an entity takes part in, optionally in one species
# (?species= by taxId, dbId or name), and the same of every form of it
# (/allForms), and the diagrams either is drawn in (/diagram/entity/...).
# graph-core's queries, kept as written so the rows come in Java's order.
# Byte-identical to Java over 23 ids for the plain form and 82 requests for
# the other three -- species by every form, unknown and repeated species,
# ATP's megabytes, REACT_, versioned and dbId forms, reactions, pathways,
# sets -- bar a 404 body's `url`, as above. That is every /pathways/low
# endpoint Java has.
location ~ "^/ContentService/data(;[^/]*)?/pathways(;[^/]*)?/low(;[^/]*)?/(diagram(;[^/]*)?/)?entity(;[^/]*)?/[^/]+(/allForms(;[^/]*)?)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# An event as a schema.org Dataset, for search engines: graph-core's
# SchemaDataSet over its findByStId, whose unsorted load decides the order of
# creators and citations, and the lazy loads behind each author. Byte-identical
# to Java over 30 requests -- pathways and reactions, every id form, Java's
# 404 (an object with no relationship included), 422 and 500 -- bar an error
# body's `url`, as above.
location ~ "^/ContentService/data(;[^/]*)?/discover(;[^/]*)?/[^/]+/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# The reactions and pathways an identifier in an outside resource takes part
# in, optionally in one species: graph-core's MappingRepository queries as
# written, each ordered by stable id. A chemical resource defaults to human; a
# GO identifier is cut to its digits and asks GO's own question; an unknown
# species is Java's 404. Byte-identical to Java over 37 requests -- every
# species form, chemicals, GO, Ensembl, gene names, matrix parameters -- bar
# a 404 body's `url`, as above.
location ~ "^/ContentService/data(;[^/]*)?/mapping(;[^/]*)?/[^/]+/[^/]+/(reactions(;[^/]*)?|pathways(;[^/]*)?)/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# The reference entities an identifier names, and their cross references and
# physical entities, one identifier or a page of a batch (POST .../xrefs).
# The controller writes the identifier and database filter into its query
# text; node does the same in read-only sessions, so a quote breaks or
# rewrites the query as in Java and Java's 500 is the answer. A batch asks
# four at a time, as Java's parallel stream asks several. Byte-identical to
# Java over 47 requests -- filters, a batch's every paging edge (a long
# offset past 2^53 too), split rules, broken and rewritten queries, empty
# entity lists -- bar an error body's `url`, as above.
location ~ "^/ContentService/references(;[^/]*)?/mapping(;[^/]*)?/[^/]+(/xrefs(;[^/]*)?)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# Every event below a pathway, at any depth, written whole, and one attribute
# of each as Java's List.toString writes them: graph-core's
# getContainedEvents query as written, its records mapped as Spring Data maps
# many records -- one object per node across them, an object met again filled
# again and its collections merged -- with Jackson's identity across the list.
# Byte-identical to Java over 39 requests -- pathways of up to 400KB, every id
# form (a dbId past a long and an id of dots are Java's 500s), the nested
# views, attributes loaded lazily -- bar an error body's `url`, as above.
location ~ "^/ContentService/data(;[^/]*)?/pathway(;[^/]*)?/[^/]+/containedEvents(;[^/]*)?(/[^/]+)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# What a complex or set is made of, all the way down (?excludeStructures for
# only what is neither), and the complexes an identifier in an outside
# resource is part of, the resource a regular expression as Java reads it.
# graph-core's queries as written. Byte-identical to Java over 43 requests --
# every class of entity, dbId, REACT_ and versioned ids, Java's 500 for
# excludeStructures with a stable id and for a resource that is no regular
# expression, its 400 and 404s -- bar an error body's `url`, as above.
location ~ "^/ContentService/data(;[^/]*)?/(complex(;[^/]*)?/[^/]+/subunits(;[^/]*)?|complexes(;[^/]*)?/[^/]+/[^/]+)/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# The reference entities behind every participant of an event, all the way
# down, and the physical entities themselves (/participatingPhysicalEntities).
# Java's queries, kept as written so the rows come in Java's order; Java's
# contract kept too -- an unknown id is [], an unreadable one a 200 with no
# body. Byte-identical to Java: /referenceEntities over 15 ids, three top-level
# pathways of up to 11MB among them; /participatingPhysicalEntities over 14,
# every id form and a top-level pathway's 285KB among them.
location ~ "^/ContentService/data(;[^/]*)?/participants(;[^/]*)?/[^/]+/(referenceEntities(;[^/]*)?|participatingPhysicalEntities(;[^/]*)?)/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# An event's participants, each with the reference entities behind it. Java's
# two queries (one per kind of id -- they differ) kept as written, and its
# contract: an unknown id is [], an unreadable one a 200 with no body.
# Byte-identical to Java over 19 ids, three 6MB top-level pathways among them.
location ~ "^/ContentService/data(;[^/]*)?/participants(;[^/]*)?/[^/]+/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# The other forms of a physical entity -- the same reference entity, modified,
# elsewhere or in another species -- and what an entity or event is part of
# (/componentOf). Java's queries kept as written; nothing found is Java's 404.
# otherForms byte-identical to Java over 25 ids covering every class that
# appears (EWAS by reference type, simple entities, drugs); componentOf over
# 21, ATP's megabyte, every id form, events and every class of entity among
# them; both bar a 404 body's url, as above. /entity/{id}/in-depth is above.
location ~ "^/ContentService/data(;[^/]*)?/entity(;[^/]*)?/[^/]+/(otherForms(;[^/]*)?|componentOf(;[^/]*)?)/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# Every place an object appears in the Pathway Browser, one tree per top-level
# pathway down to the object, each node with the address that opens it there.
# graph-core's tree building and PathwayBrowserLocationsUtils kept line for
# line, and its query's match and expansion exactly, because the tree is built
# from the order the paths come back in. Both parameters read as Spring reads a
# Boolean. Byte-identical to Java over 83 requests -- every entity class,
# events, other species, dbId, REACT_ and versioned ids, the 12MB answers for
# common small molecules, every parameter form with its 400s and 500s -- bar an
# error body's url, as above.
# /detail/{id}/getReverseGraph and getSubGraph stay with Java, and so does
# /eventsHierarchy/{species}: its pathway sizes come from the analysis
# service's data, which the graph does not hold.
location ~ "^/ContentService/data(;[^/]*)?/detail(;[^/]*)?/[^/]+/locationsInPWB(;[^/]*)?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# A schema class's count, optionally in one species, and one page of its
# objects as dbId, stId, name and class: the schema browser. graph-core's
# queries kept as written, so a page's rows -- ordered by name, ties in the
# plan's order -- are Java's. The two answers Java gets by reflection (is it a
# class; has it a species) come from a table, tools/content-node/schema.mjs,
# which says how to keep it current. page and offset read as Spring reads an
# Integer. Byte-identical to Java over every class, every species form and the
# paging edges (see the PR), bar an error body's url, as above.
#
# A class's attributes and referrals are graph-core's reflection over its own
# classes, no database: Java's answers for every class, captured once into
# tools/content-node/schema-snapshot.json (snapshot-schema.mjs says when to
# regenerate it). The class tree, /schema/model, is the graph's label counts
# built into a tree as getGraphModelTree builds it, held for the life of the
# process as Java holds it. Byte-identical to Java for both over all 113
# classes, the woven closures, and the model, bar an error body's url.
# One page of a class's objects, whole, is node's too: graph-core's query as
# written, so pages keep Java's order among the thousands of shared names.
# And /reference: one page of a reference class's objects, by identifier.
# The class tree, /schema/model, is this location's too.
location ~ "^/ContentService/data(;[^/]*)?/schema(;[^/]*)?/[^/]+(/(count(;[^/]*)?|min(;[^/]*)?|attributes(;[^/]*)?|referrals(;[^/]*)?|reference(;[^/]*)?))?/?$" {
    include /etc/nginx/common/content-node-proxy.conf;
}

# The bare API roots are this site's API page, not the service's. Opened
# directly they used to reach Tomcat's legacy Swagger page, whose copy of the old
# reactome.org menu leads to pages this site does not have. Only the roots:
# everything beneath them is the API and falls through to the prefixes below.
# Same rule as `apiPage` in proxy.conf.js, which the dev
# server and serve-prod use.
#
# Exact matches rather than one regex: for `/ContentService` without the slash,
# nginx answers a prefix location ending in `/` with its own 301 before a regex
# is consulted. An exact match is chosen before either.
location = /ContentService { include /etc/nginx/common/upstream-proxy.conf; proxy_pass http://site; }
location = /ContentService/ { include /etc/nginx/common/upstream-proxy.conf; proxy_pass http://site; }
location = /AnalysisService { include /etc/nginx/common/upstream-proxy.conf; proxy_pass http://site; }
location = /AnalysisService/ { include /etc/nginx/common/upstream-proxy.conf; proxy_pass http://site; }

# ReactomeGSA's landing page on reactome.org was a separate app, with paths
# beneath it (/gsa/home). Its wizard is built into the Pathway Browser here, and
# papers and bookmarks carry the old address. The app redirects it too.
location ~ ^/gsa(/|$) { return 301 /PathwayBrowser?analysisTab=quantitative; }

location /ContentService/ {
    include /etc/nginx/common/upstream-proxy.conf;
    proxy_pass http://content/ContentService/;
    # A diagram or SBML export takes minutes. Apache's default is 300s and the
    # site relies on it; nginx defaults to 60 and would cut them off.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location /AnalysisService/ {
    include /etc/nginx/common/upstream-proxy.conf;
    proxy_pass http://analysis/AnalysisService/;
    # An analysis over a large identifier list is not quick either.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}



# The site itself.
location / {
    include /etc/nginx/common/upstream-proxy.conf;
    proxy_pass http://site/;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
