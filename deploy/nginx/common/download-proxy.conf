# /download/ on reactome.org and beta: the download site's files at the site's
# own address (specs/032 T037). Included inside the site's server block, by
# production.conf and dev.conf; download-site.conf, at their top level, holds
# the upstream, the release's map and the budget.
#
# A proxy, not a redirect, because outside scripts fetch
# reactome.org/download/current/... with a plain `curl`, which does not follow
# one. The files stay on the download site; nothing is kept on this host, not
# even a large file on its way through (proxy_max_temp_file_size 0).
#
# Prefixes with ^~, so no regex location of the routes is tried for them. The
# site's own page is /download-data, which these do not match.

# `current`, which the download site does not have: the release this server
# names (download-site.conf), sent round again as that numbered folder. Without
# a release named, or with something other than a number named, a 503 saying
# so, never the download site's /current/.
location ^~ /download/current/ {
    default_type text/plain;
    if ($download_folder = "") {
        return 503 "This server names no release for /download/current/.\n";
    }
    rewrite ^/download/current/(.*)$ /download/$download_folder/$1 last;
}

location ^~ /download/ {
    # Files are read, never written: GET, and HEAD with it.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    limit_req  zone=download_rate burst=40 nodelay;
    limit_conn download_conn 16;

    # The path under /download/ is the path on the download site, the query
    # dropped: a file has none, and a bucket reads some as requests of its own.
    # $uri is nginx's normalised path, so `..` (encoded or not) is resolved
    # before any location is chosen: it cannot leave /download/, and the host is
    # fixed whatever the path says.
    rewrite ^/download/(.*)$ /$1? break;
    proxy_pass https://download_site;

    # Pooled (download-site.conf's keepalive).
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # The reader's headers are not passed -- not cookies, not Authorization, not
    # their address -- only what a download needs: its host, and resuming or
    # revalidating a file. An empty one is not sent.
    proxy_pass_request_headers off;
    proxy_set_header Host                download.reactome.org;
    proxy_set_header Range               $http_range;
    proxy_set_header If-Range            $http_if_range;
    proxy_set_header If-None-Match       $http_if_none_match;
    proxy_set_header If-Modified-Since   $http_if_modified_since;
    proxy_set_header If-Match            $http_if_match;
    proxy_set_header If-Unmodified-Since $http_if_unmodified_since;

    # The download site's name in the handshake, and its certificate checked
    # against the image's CA bundle. Its chain is a leaf, an intermediate and a
    # root.
    proxy_ssl_server_name         on;
    proxy_ssl_name                download.reactome.org;
    proxy_ssl_verify              on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth        3;

    # Kept: Content-Type, Content-Length, ETag, Last-Modified, Accept-Ranges,
    # Content-Range. Hidden: what the bucket and the CDN say about themselves.
    proxy_hide_header Set-Cookie;
    proxy_hide_header Via;
    proxy_hide_header X-Cache;
    proxy_hide_header X-Amz-Cf-Id;
    proxy_hide_header X-Amz-Cf-Pop;
    proxy_hide_header X-Amz-Id-2;
    proxy_hide_header X-Amz-Request-Id;
    proxy_hide_header X-Amz-Version-Id;
    proxy_hide_header X-Amz-Server-Side-Encryption;
    proxy_hide_header X-Amz-Storage-Class;
    proxy_hide_header X-Amz-Expiration;
    add_header Cache-Control $download_cache_control;

    # A missing file is a 404 here. The bucket answers 403 for one (it lists to
    # no one), with its own XML; neither that nor the site's page goes back.
    proxy_intercept_errors on;
    error_page 403 404 = @download_missing;

    # Streamed through memory buffers: a file larger than they hold waits on the
    # reader rather than being written to this host's disk.
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
}

location @download_missing {
    default_type text/plain;
    return 404 "Not found.\n";
}
