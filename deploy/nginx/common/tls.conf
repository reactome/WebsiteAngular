# TLS settings.
#
# Written out rather than `include /etc/letsencrypt/options-ssl-nginx.conf`,
# which is what certbot's nginx plugin would provide -- and that plugin is not
# installed on the dev box: only python3-certbot-apache and
# python3-certbot-dns-cloudflare are. A config that includes a file which does
# not exist does not start, and finding that out during a cutover is the worst
# time to find it out.
ssl_session_cache   shared:le_nginx_SSL:10m;
ssl_session_timeout 1440m;
ssl_session_tickets off;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305";
