# The download site behind /download/, for the hosts that proxy it (production
# and beta; specs/032 T037). Included at the top level of production.conf and
# dev.conf; the locations are download-proxy.conf, inside the site's server.
# release.conf redirects instead (specs/032 D5) and includes neither.

# The release /download/current/ means on this host. The download site has no
# `current` folder, only numbered ones, so the server names its release in its
# own folder -- one line, `reactome.org 98;` on production, `beta.reactome.org
# 98;` on beta, in site-local/download-release.map, as the release server does
# -- and changes it on release day with IMAGE_TAG. No default: without the
# line, /download/current/ answers 503 rather than going anywhere.
map $host $download_release {
    include /etc/nginx/site-local/download-release.map*;
}

# Only a release's number is a folder: a line naming anything else (a host, a
# path, `..`) is treated as no line at all.
map $download_release $download_folder {
    "~^[0-9]+$" $download_release;
    default     "";
}

# What the download site says about caching, when it says anything; otherwise
# an hour. It sends nothing today. An hour because `current` moves at a release:
# the edge cache keeps a file no longer than that after the map line changes,
# and the release day's purge clears it sooner.
map $upstream_http_cache_control $download_cache_control {
    ""      "public, max-age=3600";
    default "";
}

# The download site: a CDN in front of a bucket. Its addresses rotate, so the
# name is resolved again whenever the answer expires, never once at start
# (`resolve`, which needs the zone and a resolver here). A failed lookup fails
# /download/ alone, not nginx's start. The same public resolvers /GSAServer/
# uses (routes.conf): this repository names no private address, and nginx does
# not read the host's resolv.conf. Pooled, with the pool's idle time short so
# the CDN never closes a pooled socket first.
upstream download_site {
    zone download_site 64k;
    resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;
    resolver_timeout 5s;
    server download.reactome.org:443 resolve;
    keepalive 8;
    keepalive_timeout 4s;
}

# A budget of its own, per address. A request here is a file read, not work,
# but every byte goes through this host. 10 a second with a burst of 40 is far
# beyond a person and beyond a script fetching one file after another; it
# stops one address from fanning out over thousands of files at once. And at
# most 16 downloads in flight per address, in place of the site's 64.
limit_req_zone  $binary_remote_addr zone=download_rate:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=download_conn:10m;
