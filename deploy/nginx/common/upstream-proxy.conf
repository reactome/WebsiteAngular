# Shared proxy behaviour. Included inside a location.
#
# Connection handling is the part to read, because it is why this exists.
#
# Measured on the dev box 2026-09-16, sockets to Tomcat's 8080:
#
#     76 CLOSE-WAIT      19 ESTABLISHED
#
# CLOSE-WAIT means the far end sent FIN and the near end never closed. Four out
# of five connections to Tomcat were leaked file descriptors. Whether Apache or
# Tomcat is at fault is not settled and does not need to be: the pairing is what
# produces it, and this is the layer where the behaviour is chosen rather than
# inherited.
#
# nginx's default is HTTP/1.0 upstream with `Connection: close` -- a new
# connection per request, which cannot leak but pays setup on every one.
#
# The two directives below opt out of that, and they are only safe alongside a
# `keepalive` directive in the upstream block. Without one, clearing the
# Connection header tells the backend to hold the socket open while nginx has no
# pool to keep it in -- which is a way of *causing* the CLOSE-WAIT pile above,
# not curing it. An earlier draft of this file did exactly that: it described
# pooling and configured none. Every upstream now sets `keepalive`, and its
# timeout is shorter than the backend's so the backend never closes first.
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Timeouts are NOT set here. nginx rejects a duplicate directive in the same
# context, so a shared default plus a per-route override does not compile -- and
# the routes genuinely differ: a diagram export takes minutes, the chat holds a
# connection for an hour. Each location sets its own, which also means the value
# is visible where it matters rather than inherited from a file you have to go
# and read.

# Do not hold a failed backend against the reader: retry the next upstream
# rather than returning its error, but never replay a request that is not safe
# to repeat.
#
# `http_500` is in the list because of how the node port fails. A container that
# is up and cannot reach the graph answers 500, not 502 -- and that is the
# likelier fault than the process being gone: wrong credentials, a graph
# swapped between releases, a database still starting. Measured against the live
# site by running the service with no credentials: direct to node 500, through
# nginx 500, and the contents page broke, while the Tomcat backup sat unused
# because a 500 did not count as a reason to try it.
#
# Only upstreams with more than one server can act on this, which today means
# `content_node` alone; elsewhere it changes nothing. And nginx will not repeat
# a POST or any other non-idempotent method unless `non_idempotent` is listed,
# which it deliberately is not.
proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
proxy_next_upstream_tries 2;
