# Shared proxy behaviour. Included inside a location.
#
# Connection handling is the part to read, because it is why this exists.
#
# Measured on the dev box 2026-09-16, sockets to Tomcat's 8080:
#
#     76 CLOSE-WAIT      19 ESTABLISHED
#
# CLOSE-WAIT means the far end sent FIN and the near end never closed. Four out
# of five connections to Tomcat were leaked file descriptors. Whether Apache or
# Tomcat is at fault is not settled and does not need to be: the pairing is what
# produces it, and this is the layer where the behaviour is chosen rather than
# inherited.
#
# nginx's default is HTTP/1.0 upstream with `Connection: close` -- a new
# connection per request, which cannot leak but pays setup on every one. Pooling
# is configured deliberately in each upstream block instead, with a keepalive
# timeout that MUST be shorter than the backend's own, or the backend closes
# first and the pool hands out sockets that are already gone. That race is
# exactly how a CLOSE-WAIT pile builds.
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Timeouts are NOT set here. nginx rejects a duplicate directive in the same
# context, so a shared default plus a per-route override does not compile -- and
# the routes genuinely differ: a diagram export takes minutes, the chat holds a
# connection for an hour. Each location sets its own, which also means the value
# is visible where it matters rather than inherited from a file you have to go
# and read.

# Do not hold a failed backend against the reader: retry the next upstream
# rather than returning its error, but never replay a request that is not safe
# to repeat.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
