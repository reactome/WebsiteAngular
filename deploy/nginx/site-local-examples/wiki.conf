# A wiki on a host name of its own, its scripts run by PHP-FPM (copy into the
# server's site-local/ and fill in the name, folder, certificate and socket).
#
# nginx runs no PHP itself: an old web server's in-process PHP goes with the
# old web server. PHP-FPM on the host, its socket's folder mounted into the
# nginx container (compose override: /run/php:/run/php), or PHP-FPM in a
# container (`fastcgi_pass 127.0.0.1:9000;` instead). Either way the wiki's
# folder is mounted at the same path in nginx and in PHP-FPM.
server {
    listen 80;
    server_name wiki.example;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name wiki.example;
    ssl_certificate     /etc/letsencrypt/live/wiki.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wiki.example/privkey.pem;
    include             /etc/nginx/common/tls.conf;

    # The folder the wiki is installed in, mounted into nginx read-only.
    root  /srv/wiki;
    index index.php;

    # The wiki's upload limit today; refused above it otherwise.
    client_max_body_size 100m;

    # Its configuration, cache and private data are never served.
    location ~ ^/(cache|images/deleted|includes|maintenance|serialized|vendor)/ { return 403; }
    location ~ /\.(?!well-known/) { return 403; }
    location = /LocalSettings.php { return 403; }

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_read_timeout 300s;
    }
}
