# A host name that only redirects (copy into the server's site-local/ and fill
# in the names and certificate). Not default_server: unknown names keep the
# repository's refusal.
server {
    listen 80;
    listen 443 ssl;
    server_name redirect.example;
    ssl_certificate     /etc/letsencrypt/live/redirect.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redirect.example/privkey.pem;
    include             /etc/nginx/common/tls.conf;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://target.example$request_uri; }
}
