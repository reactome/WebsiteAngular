# The build service's pages, at a path on the release host (copy into the
# server's site-local/release/ and fill in the path and port).
#
# ^~ so that this prefix wins over the site's own regular-expression routes;
# a regular-expression location here would load and never be reached.
location ^~ /build/ {
    # The service's own port, on the host's loopback (nginx shares its network).
    proxy_pass http://127.0.0.1:8081;
    include /etc/nginx/common/upstream-proxy.conf;
    # The service writes absolute addresses into its pages and redirects. It
    # reads them from these: without them it writes its own loopback port, and
    # every link and login redirect goes nowhere.
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;
    proxy_set_header X-Forwarded-Proto https;
    # Its console streams: buffered, a running job's log arrives only at the
    # end, or not at all if the job outlives the buffer.
    proxy_buffering         off;
    proxy_request_buffering off;
    # Long requests (a job's log followed, a large artefact) are cut off at
    # nginx's default 60 s.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    # Uploads (a plugin, a job's parameters file): refused above the server's
    # 64 MB otherwise.
    client_max_body_size 512m;
}
