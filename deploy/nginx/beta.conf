# beta.reactome.org, as nginx would serve it.
#
# NOT IN USE. beta is served by Apache, configured by hand on the dev box. This
# is that configuration written down so it can be reviewed, diffed and rebuilt —
# which is the point of #203, and the reason it exists before any cutover.
#
# It is a faithful translation of what is running, read off the box on
# 2026-09-16, plus the one route Apache does not have: `/api/`, which DeltaSignal
# needs and which is why it cannot work on beta today.
#
# Read `deploy/nginx/README.md` before putting this anywhere near port 443. The
# order of operations matters and certbot comes first.

# WebSocket upgrade. The Angular dev server and the chat both need it, and a
# reverse proxy that does not pass these two headers renders the UI and then
# hangs with no replies — the failure the Apache chat config records having hit.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Every request arrives from Cloudflare, so $remote_addr is Cloudflare's. Without
# this, logs and any IP-based rule describe Cloudflare rather than the client —
# the Apache bot-block config has the same note, and it is the reason its rules
# match on User-Agent only.
#
# The ranges belong in a generated file rather than hand-copied: they change, and
# a stale range silently means real client IPs stop resolving.
# include /etc/nginx/cloudflare-ranges.conf;
real_ip_header CF-Connecting-IP;

# Bot blocking, translated from deploy/apache/beta-bot-blocks.conf. Keep the two
# in step until one of them is retired; the comments there explain why this host
# is far more aggressive than production — it must not be indexed at all, and
# each pathway URL walked is a Neo4j query against a heap that fills in minutes.
map $http_user_agent $blocked_agent {
    default 0;

    # 1. Named AI and SEO crawlers. Same list as production, kept in sync
    #    deliberately: add here and there together.
    "~*(Amzn-SearchBot|Amazonbot|PetalBot|AhrefsBot|SemrushBot|DataForSeo|MJ12bot|DotBot|CCBot|Barkrowler|Bytespider|GPTBot|ClaudeBot|Claude-Web|anthropic-ai|PerplexityBot|Bytedance|SeekportBot|serpstatbot|ZoominfoBot|Diffbot|ImagesiftBot|Timpibot|Omgilibot|meta-externalagent|Applebot-Extended)" 1;

    # 2. Scripted clients. curl and wget are deliberately absent: they are how
    #    this host is checked from outside, and a blocked health check is worse
    #    than a scraped page.
    "~*(python-requests|python-urllib|aiohttp|httpx|Go-http-client|Java/|okhttp|libwww-perl|Scrapy|node-fetch|axios)" 1;

    # 3. Anything self-identifying as automation. Safe *here* precisely because
    #    this host must not be indexed — do not copy to production, it blocks
    #    Googlebot and Bingbot too. CUBOT is an Android phone brand whose UA
    #    contains "bot", so it is excluded first: a rule that blocks a real
    #    device is worse than one that misses a crawler.
    "~*CUBOT"                                                              0;
    "~*(bot|crawler|crawling|spider|scraper|fetcher|archiver|indexer)"      1;
}

server {
    listen 80;
    server_name beta.reactome.org;
    # certbot writes its challenge here; everything else goes to TLS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name beta.reactome.org;

    ssl_certificate     /etc/letsencrypt/live/beta.reactome.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.reactome.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    if ($blocked_agent) { return 403; }

    # A diagram export can take minutes. Apache's default is 300s and beta
    # relies on it; nginx defaults to 60 and would cut them off.
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    client_max_body_size  64m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The Tina admin must never be publicly reachable.
    #
    # A regex, not `^~ /admin`, which is a *prefix* match and also denied
    # `/adminfoo` — a URL Apache serves. Its rule is
    # `LocationMatch "^/admin(/|$)"`, so this matches the same two shapes and no
    # others. Caught by asking the running config rather than by reading it.
    #
    # A regex location beats the `/` catch-all in nginx regardless of order, so
    # this cannot be defeated by moving it.
    location ~ ^/admin(/|$) { return 403; }

    # Tomcat on this box, not the public host: beta's own Tomcat serves
    # endpoints the public one does not.
    location /ContentService/  { proxy_pass http://127.0.0.1:8080/ContentService/; }
    location /AnalysisService/ { proxy_pass http://127.0.0.1:8080/AnalysisService/; }

    # DeltaSignal. Not in the Apache config, which is exactly why DeltaSignal
    # cannot work on beta: the Angular side calls /api/pathways, /api/parse and
    # /api/solve as bare relative paths, routed only by proxy.conf.js — the dev
    # server's proxy, which does not exist in a built artifact.
    #
    # 8090, not 8080. DeltaSignal's own compose binds 8080, which on this box is
    # Tomcat, so an unconfigured deployment sends these calls to Tomcat and gets
    # 404s from a real server rather than a clear failure.
    location /api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        # Solving a perturbation is not a fast request.
        proxy_read_timeout 300s;
    }

    # The chatbot. A plain proxy renders its UI and then hangs with no replies:
    # it is server-sent events and needs buffering off as well as the upgrade
    # headers. The Apache config records having hit exactly this.
    location = /chat { return 302 /chat/; }
    location /chat/ {
        proxy_pass http://127.0.0.1:8000/chat/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # The site itself, served by serve-prod.js out of dist/.
    location / {
        proxy_pass http://127.0.0.1:4200/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
