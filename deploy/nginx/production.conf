# reactome.org — the public site.
#
# THE IMPORTANT DIFFERENCE: this file does NOT include block-all-automation.conf.
#
# That rule blocks anything self-identifying as a bot, which is safe on a host
# that must not be indexed and catastrophic here: it blocks Googlebot and
# Bingbot along with the rest, and Reactome needs to be found. The Apache
# configuration it came from carries the same warning. Only the named AI and SEO
# crawlers are refused.
#
# Traffic here is the reason nginx is worth the change at all. On the dev box the
# choice is marginal; at production volume it is not, and the connection handling
# in common/upstream-proxy.conf is deliberate rather than inherited — see the
# CLOSE-WAIT measurement recorded there.

upstream site {
    server 127.0.0.1:4200;
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # serve-prod.js is node, whose server.keepAliveTimeout defaults to 5s;
    # measured at 6.0s against the running server, so 4s leaves room.
    keepalive          32;
    keepalive_timeout  4s;
    keepalive_requests 1000;
}
upstream content {
    server 127.0.0.1:8080;   # Tomcat today, node later
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # Tomcat's keepAliveTimeout defaults to 20s; measured at 20.0s, so 10s
    # leaves room.
    keepalive          32;
    keepalive_timeout  10s;
    keepalive_requests 1000;
}
upstream analysis {
    server 127.0.0.1:8080;   # the analysis maths stays Java
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # Tomcat's keepAliveTimeout defaults to 20s; measured at 20.0s, so 10s
    # leaves room.
    keepalive          32;
    keepalive_timeout  10s;
    keepalive_requests 1000;
}
upstream deltasignal {
    server 127.0.0.1:8090;
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # the Julia server held an idle socket past 25s when measured, so 10s
    # is comfortably under it.
    keepalive          32;
    keepalive_timeout  10s;
    keepalive_requests 1000;
}
upstream chatbot {
    server 127.0.0.1:8000;
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # this one is uvicorn, not Tomcat: --timeout-keep-alive defaults to 5s
    # and is not set on the container; measured at 5.0s, so 4s leaves room.
    keepalive          32;
    keepalive_timeout  4s;
    keepalive_requests 1000;
}

include /etc/nginx/common/websocket.conf;
include /etc/nginx/common/cloudflare-real-ip.conf;
include /etc/nginx/common/block-ai-crawlers.conf;

# Higher than the non-public hosts, because real readers arrive in numbers here
# and a limit tuned for a single-user dev box would throttle a lecture theatre.
# Still present: a crawler that ignores robots.txt costs the same Neo4j queries
# whichever host it walks.
limit_req_zone  $binary_remote_addr zone=prod_rate:20m rate=600r/s;
limit_conn_zone $binary_remote_addr zone=prod_conn:20m;

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/reactome.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reactome.org/privkey.pem;
    include             /etc/nginx/common/tls.conf;
    return 503;
}

server {
    listen 80;
    server_name reactome.org www.reactome.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://reactome.org$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.reactome.org;
    ssl_certificate     /etc/letsencrypt/live/reactome.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reactome.org/privkey.pem;
    include             /etc/nginx/common/tls.conf;
    # One canonical host, so links and search results do not split between two.
    return 301 https://reactome.org$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name reactome.org;

    ssl_certificate     /etc/letsencrypt/live/reactome.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reactome.org/privkey.pem;
    include             /etc/nginx/common/tls.conf;

    # Denied: this host faces the internet.
    location ~ ^/admin(/|$) { return 403; }

    if ($blocked_crawler) { return 403; }

    limit_req  zone=prod_rate burst=300 nodelay;
    limit_conn prod_conn 64;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 64m;

    include /etc/nginx/common/routes.conf;
}
