# beta.reactome.org, on the development box.
#
# The strictest of the four: this host must not be indexed at all, and each
# pathway URL walked is a Neo4j query against a Tomcat heap that fills within
# minutes. So the default is "no automation", not "no bad automation".

upstream site {
    server 127.0.0.1:4200;   # the built app, via serve-prod.js
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # serve-prod.js is node, whose server.keepAliveTimeout defaults to 5s;
    # measured at 6.0s against the running server, so 4s leaves room.
    keepalive          32;
    keepalive_timeout  4s;
    keepalive_requests 1000;
}
upstream content_node {
    # The node port of the content service (tools/content-node). Loopback on a
    # host; a service name in compose. Supervised by content-node.service --
    # unsupervised it runs only because somebody started it, and the contents
    # page goes blank the first time the box reboots.
    server 127.0.0.1:4400;
    keepalive 8;
}
upstream content {
    server 127.0.0.1:8080;   # Tomcat today, node later
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # Tomcat's keepAliveTimeout defaults to 20s; measured at 20.0s, so 10s
    # leaves room.
    keepalive          32;
    keepalive_timeout  10s;
    keepalive_requests 1000;
}
upstream analysis {
    server 127.0.0.1:8080;
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # Tomcat's keepAliveTimeout defaults to 20s; measured at 20.0s, so 10s
    # leaves room.
    keepalive          32;
    keepalive_timeout  10s;
    keepalive_requests 1000;
}
upstream deltasignal {
    server 127.0.0.1:8090;   # NOT 8080: that is Tomcat here
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # the Julia server held an idle socket past 25s when measured, so 10s
    # is comfortably under it.
    keepalive          32;
    keepalive_timeout  10s;
    keepalive_requests 1000;
}
upstream chatbot {
    server 127.0.0.1:8000;
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # this one is uvicorn, not Tomcat: --timeout-keep-alive defaults to 5s
    # and is not set on the container; measured at 5.0s, so 4s leaves room.
    keepalive          32;
    keepalive_timeout  4s;
    keepalive_requests 1000;
}

include /etc/nginx/common/websocket.conf;
include /etc/nginx/common/cloudflare-real-ip.conf;
include /etc/nginx/common/block-ai-crawlers.conf;
include /etc/nginx/common/block-all-automation.conf;

# Replaces mod_evasive, which is active on this host: 12 requests per page per
# second, 100 per site, blocked for 60. Keyed on the client address, which is
# only meaningful because the real-IP block above is included — without it every
# request appears to come from Cloudflare and one bucket covers the internet.
limit_req_zone  $binary_remote_addr zone=dev_rate:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=dev_conn:10m;

# The retired hostnames stay retired, and so does anything else pointed here.
#
# This box needs exactly one Let's Encrypt certificate -- beta.reactome.org --
# and keeps dev.reactome.org's for a planned move. The wikis are on the release
# machine.
#
# Every name other than beta answers 503. That matters more than it looks: if
# nginx served only beta, a request for one of the retired names would fall to
# the default server and could be answered with beta's content under a name
# meant to be gone. The explicit block below makes that impossible.
#
# It is also a reason to prefer nginx here. The retired site runs on an Apache
# loading modules this configuration does not load at all, so a class of problem
# that currently has to be held shut stops being reachable. The specifics belong
# in internal notes, not in a public repository.

# The retired names: dev.reactome.org, and the two aliases the old vhost answers
# for.
#
# They present the **Cloudflare Origin certificate**, because that is what Apache
# presents -- `SSLCertificateFile /etc/ssl/cloudflare/reactome-origin.crt` in
# `001-reactome.conf`, with the Let's Encrypt line commented out beneath it.
# Verified by asking the running server what it serves for each name, which is
# how this was found: an earlier draft presented Let's Encrypt certificates here
# because the certificates existed, not because anything used them.
#
# All traffic arrives through Cloudflare, so an Origin certificate is the right
# thing on this leg. It is issued by Cloudflare, long-lived, and not renewed by
# certbot at all -- which is why none of the certbot work touches it.
server {
    listen 80;
    listen 443 ssl;
    server_name dev.reactome.org reactome.org www.reactome.org;
    ssl_certificate     /etc/ssl/cloudflare/reactome-origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/reactome-origin.key;
    include             /etc/nginx/common/tls.conf;
    return 503;
}

# Anything else pointed at this box.
#
# A name we do not serve cannot be answered without a certificate mismatch
# whatever we present, so beta's is used and the answer is 503 regardless. The
# point is that it is never silently served beta's content.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/beta.reactome.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.reactome.org/privkey.pem;
    include             /etc/nginx/common/tls.conf;
    return 503;
}

server {
    listen 80;
    server_name beta.reactome.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name beta.reactome.org;

    ssl_certificate     /etc/letsencrypt/live/beta.reactome.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.reactome.org/privkey.pem;
    include             /etc/nginx/common/tls.conf;

    # The Tina admin, denied: this host faces the internet.
    #
    # A regex, not `^~ /admin`, which is a prefix match and would also catch
    # `/adminfoo` — a URL the Apache this replaces serves. Its rule is
    # `LocationMatch "^/admin(/|$)"`, so this matches the same two shapes.
    # A regex location beats the `/` catch-all regardless of order.
    location ~ ^/admin(/|$) { return 403; }

    if ($blocked_crawler)    { return 403; }
    if ($blocked_automation) { return 403; }

    # burst absorbs the dozen parallel requests one diagram legitimately makes;
    # nodelay so a real reader is not queued behind their own page.
    limit_req  zone=dev_rate burst=100 nodelay;
    limit_conn dev_conn 24;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 64m;

    include /etc/nginx/common/routes.conf;
}
