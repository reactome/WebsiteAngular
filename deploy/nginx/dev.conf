# beta.reactome.org, on the development box.
#
# The strictest of the four: this host must not be indexed at all, and each
# pathway URL walked is a Neo4j query against a Tomcat heap that fills within
# minutes. So the default is "no automation", not "no bad automation".

upstream site {
    server 127.0.0.1:4200;   # the built app, via serve-prod.js
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # serve-prod.js is node, whose server.keepAliveTimeout defaults to 5s;
    # measured at 6.0s against the running server, so 4s leaves room.
    keepalive          32;
    keepalive_timeout  4s;
    keepalive_requests 1000;
}
upstream content_node {
    # The node port of the content service (tools/content-node), run by compose
    # with `restart: unless-stopped`. Loopback while it shares the host's
    # network namespace; a service name once the graph is a container too and
    # both join the compose network (specs/006 D13).
    server 127.0.0.1:4400;
    # No backup, deliberately. A path served by node is answered by node or
    # fails visibly; it never quietly comes from Java. Falling back would hide
    # which backend answered, and these routes are how Java's ContentService
    # is retired, endpoint by endpoint, until Tomcat can be switched off.
    keepalive 8;
}
upstream content {
    server 127.0.0.1:8080;   # Tomcat today, node later
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # Tomcat's keepAliveTimeout defaults to 20s; measured at 20.0s, so 10s
    # leaves room.
    keepalive          32;
    keepalive_timeout  10s;
    keepalive_requests 1000;
}
upstream analysis {
    server 127.0.0.1:8080;
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # Tomcat's keepAliveTimeout defaults to 20s; measured at 20.0s, so 10s
    # leaves room.
    keepalive          32;
    keepalive_timeout  10s;
    keepalive_requests 1000;
}
upstream deltasignal {
    server 127.0.0.1:8090;   # NOT 8080: that is Tomcat here
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # the Julia server held an idle socket past 25s when measured, so 10s
    # is comfortably under it.
    keepalive          32;
    keepalive_timeout  10s;
    keepalive_requests 1000;
}
upstream chatbot {
    server 127.0.0.1:8000;
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # this one is uvicorn, not Tomcat: --timeout-keep-alive defaults to 5s
    # and is not set on the container; measured at 5.0s, so 4s leaves room.
    keepalive          32;
    keepalive_timeout  4s;
    keepalive_requests 1000;
}

# The MCP server (reactome-mcp), reached at /mcp/. Loopback only: it binds
# 127.0.0.1 itself and turns on DNS-rebinding protection there, which is what
# stops a page in a visitor's browser driving it. nginx is the only thing in
# front of it.
#
# 502 when it is not running, which is the intended behaviour -- the route
# exists in every environment and the server is turned on per environment.
upstream mcp {
    server 127.0.0.1:4320;
    keepalive 16;
}

# The headless render service, which draws diagram figures (PNG, SVG, GIF,
# PPTX, PDF) with the site's own renderer.
#
# Reached today through the site server, which proxies /RenderService from
# proxy.conf.js. Named here so nginx can put a budget in front of it before it
# ever fronts reactome.org -- which CURATOR-REPORT.md lists as the outstanding
# condition on that.
upstream render {
    server 127.0.0.1:4310;
    keepalive 16;
}

include /etc/nginx/common/websocket.conf;
include /etc/nginx/common/cloudflare-real-ip.conf;
include /etc/nginx/common/block-ai-crawlers.conf;
include /etc/nginx/common/block-all-automation.conf;
# Must follow it: this reads the variable that one defines.
include /etc/nginx/common/mcp-automation-exemption.conf;

# Replaces mod_evasive, which is active on this host: 12 requests per page per
# second, 100 per site, blocked for 60. Keyed on the client address, which is
# only meaningful because the real-IP block above is included — without it every
# request appears to come from Cloudflare and one bucket covers the internet.
limit_req_zone  $binary_remote_addr zone=dev_rate:10m rate=100r/s;

# A budget of its own, far tighter than the site's. Its README is explicit that
# the HTTP transport must sit behind something that rate-limits, and the reason
# is per-request cost rather than volume: `reactome_analyze_identifiers`
# submits a real job to the Analysis Service. The site's 100r/s is sized for
# page assets and would let one client queue analyses as fast as it can ask.
limit_req_zone $binary_remote_addr zone=mcp_rate:10m rate=2r/s;

# A budget for renders, two orders of magnitude tighter than the site's.
#
# A render is a headless browser drawing a canvas -- R-HSA-109606 comes back as
# a 7 MB, 11952x6700 PNG -- so the cost per request is seconds of CPU rather
# than a file read. The site's 100r/s is sized for page assets, and crawlers on
# the old /ContentService/exporter/* URLs are what exhausted Tomcat's heap and
# took the origin down. That is the failure this exists to prevent repeating.
#
# 2r/s with a burst of 8, which is the service's own queue depth
# (RENDER_CONCURRENCY=2, RENDER_QUEUE=8): past that it is rejecting anyway, so
# a burst larger than the queue only buys a deeper pile of work to throw away.
limit_req_zone $binary_remote_addr zone=render_rate:10m rate=2r/s;


limit_conn_zone $binary_remote_addr zone=dev_conn:10m;

# The retired hostnames stay retired, and so does anything else pointed here.
#
# This box needs exactly one Let's Encrypt certificate -- beta.reactome.org --
# and keeps dev.reactome.org's for a planned move. The wikis are on the release
# machine.
#
# Every name other than beta answers 503. That matters more than it looks: if
# nginx served only beta, a request for one of the retired names would fall to
# the default server and could be answered with beta's content under a name
# meant to be gone. The explicit block below makes that impossible.
#
# It is also a reason to prefer nginx here. The retired site runs on an Apache
# loading modules this configuration does not load at all, so a class of problem
# that currently has to be held shut stops being reachable. The specifics belong
# in internal notes, not in a public repository.

# The retired names: the two aliases the old vhost answered for.
# dev.reactome.org has its own block below.
#
# They present the **Cloudflare Origin certificate**, because that is what Apache
# presents -- `SSLCertificateFile /etc/ssl/cloudflare/reactome-origin.crt` in
# `001-reactome.conf`, with the Let's Encrypt line commented out beneath it.
# Verified by asking the running server what it serves for each name, which is
# how this was found: an earlier draft presented Let's Encrypt certificates here
# because the certificates existed, not because anything used them.
#
# All traffic arrives through Cloudflare, so an Origin certificate is the right
# thing on this leg. It is issued by Cloudflare, long-lived, and not renewed by
# certbot at all -- which is why none of the certbot work touches it.
server {
    listen 80;
    listen 443 ssl;
    server_name reactome.org www.reactome.org;
    ssl_certificate     /etc/ssl/cloudflare/reactome-origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/reactome-origin.key;
    include             /etc/nginx/common/tls.conf;
    return 503;
}

# dev.reactome.org: where ReactomeGSA delivers beta's results.
#
# ReactomeGSA knows three Reactome servers by name -- production, dev and
# release -- and uses the one a request names to map identifiers, build the
# visualisation, and store the finished result, whose token the browser opens.
# Beta names `dev` (SITE_PROFILES), so its results are stored in the Analysis
# Service beta reads, and its test runs stay off the production server.
#
# This name answers exactly those calls (reactome/gsa-backend,
# reactome_analysis_worker) and nothing else; the retired site stays retired.
server {
    listen 80;
    server_name dev.reactome.org;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name dev.reactome.org;
    ssl_certificate     /etc/ssl/cloudflare/reactome-origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/reactome-origin.key;
    include             /etc/nginx/common/tls.conf;

    limit_req  zone=dev_rate burst=100 nodelay;
    limit_conn dev_conn 24;
    # A result for many samples is several megabytes.
    client_max_body_size 64m;

    location = /AnalysisService/identifiers/projection { include /etc/nginx/common/upstream-proxy.conf; proxy_pass http://analysis; proxy_read_timeout 300s; }
    location = /AnalysisService/mapping/projection/    { include /etc/nginx/common/upstream-proxy.conf; proxy_pass http://analysis; proxy_read_timeout 300s; }
    location = /AnalysisService/import/form            { include /etc/nginx/common/upstream-proxy.conf; proxy_pass http://analysis; proxy_read_timeout 300s; }
    location ~ ^/AnalysisService/download/[^/]+/result\.json$ { include /etc/nginx/common/upstream-proxy.conf; proxy_pass http://analysis; proxy_read_timeout 300s; }

    # The link ReactomeGSA puts in its reports and emails is the old browser's,
    # `/PathwayBrowser/#/DTAB=AN&ANALYSIS=<token>`. The fragment never reaches
    # a server; the browser keeps it across the redirect, and beta reads the old
    # browser's fragments.
    location ~ ^/PathwayBrowser(/|$) { return 302 https://beta.reactome.org/PathwayBrowser/; }

    location / { return 503; }
}

# Anything else pointed at this box.
#
# A name we do not serve cannot be answered without a certificate mismatch
# whatever we present, so beta's is used and the answer is 503 regardless. The
# point is that it is never silently served beta's content.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/beta.reactome.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.reactome.org/privkey.pem;
    include             /etc/nginx/common/tls.conf;
    return 503;
}

server {
    listen 80;
    server_name beta.reactome.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name beta.reactome.org;

    ssl_certificate     /etc/letsencrypt/live/beta.reactome.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.reactome.org/privkey.pem;
    include             /etc/nginx/common/tls.conf;

    # The Tina admin, denied: this host faces the internet.
    #
    # A regex, not `^~ /admin`, which is a prefix match and would also catch
    # `/adminfoo` — a URL the Apache this replaces serves. Its rule is
    # `LocationMatch "^/admin(/|$)"`, so this matches the same two shapes.
    # A regex location beats the `/` catch-all regardless of order.
    location ~ ^/admin(/|$) { return 403; }

    if ($blocked_crawler)    { return 403; }
    if ($blocked_automation_enforced) { return 403; }

    # burst absorbs the dozen parallel requests one diagram legitimately makes;
    # nodelay so a real reader is not queued behind their own page.
    limit_req  zone=dev_rate burst=100 nodelay;
    limit_conn dev_conn 24;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 64m;

    include /etc/nginx/common/routes.conf;
}
