# beta.reactome.org, on the development box.
#
# The strictest of the four: this host must not be indexed at all, and each
# pathway URL walked is a Neo4j query against a Tomcat heap that fills within
# minutes. So the default is "no automation", not "no bad automation".

upstream site        { server 127.0.0.1:4200; }   # the built app, via serve-prod.js
upstream content     { server 127.0.0.1:8080; }   # Tomcat today, node later
upstream analysis    { server 127.0.0.1:8080; }
upstream deltasignal { server 127.0.0.1:8090; }   # NOT 8080: that is Tomcat here
upstream chatbot     { server 127.0.0.1:8000; }

include /etc/nginx/common/websocket.conf;
include /etc/nginx/common/cloudflare-real-ip.conf;
include /etc/nginx/common/block-ai-crawlers.conf;
include /etc/nginx/common/block-all-automation.conf;

# Replaces mod_evasive, which is active on this host: 12 requests per page per
# second, 100 per site, blocked for 60. Keyed on the client address, which is
# only meaningful because the real-IP block above is included — without it every
# request appears to come from Cloudflare and one bucket covers the internet.
limit_req_zone  $binary_remote_addr zone=dev_rate:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=dev_conn:10m;

# dev.reactome.org stays retired, and so does anything else pointed here.
#
# That vhost is a Joomla 3.10.12 stack, end of life since 2023, which was the
# entry vector on production and release in September 2026. Under Apache the only
# thing making this host safe is that it returns 503 for everything. If nginx
# answered only for beta, a request for dev.reactome.org — or reactome.org, which
# is an alias of that same vhost — would fall to the default server.
#
# It is also the best argument for this migration: that vhost still carries
# `Options +Includes` and `XBitHack on` with mod_include loaded. nginx has no
# mod_include, so the Server-Side Includes hole cannot exist here at all.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/beta.reactome.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.reactome.org/privkey.pem;
    include             /etc/nginx/common/tls.conf;
    return 503;
}

server {
    listen 80;
    server_name beta.reactome.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name beta.reactome.org;

    ssl_certificate     /etc/letsencrypt/live/beta.reactome.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.reactome.org/privkey.pem;
    include             /etc/nginx/common/tls.conf;

    # The Tina admin, denied: this host faces the internet.
    #
    # A regex, not `^~ /admin`, which is a prefix match and would also catch
    # `/adminfoo` — a URL the Apache this replaces serves. Its rule is
    # `LocationMatch "^/admin(/|$)"`, so this matches the same two shapes.
    # A regex location beats the `/` catch-all regardless of order.
    location ~ ^/admin(/|$) { return 403; }

    if ($blocked_crawler)    { return 403; }
    if ($blocked_automation) { return 403; }

    # burst absorbs the dozen parallel requests one diagram legitimately makes;
    # nodelay so a real reader is not queued behind their own page.
    limit_req  zone=dev_rate burst=100 nodelay;
    limit_conn dev_conn 24;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 64m;

    include /etc/nginx/common/routes.conf;
}
