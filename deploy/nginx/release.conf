# release.reactome.org — the staged release, before it is promoted.
#
# Same posture as the dev box, for the same reason: this host must not be
# indexed. A staged release appearing in search results is worse than beta doing
# so, because its content looks authoritative and its URLs stop working the day
# it is promoted.
#
# It differs from dev in what it points at, not in how it behaves.

upstream site {
    server 127.0.0.1:4200;
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # serve-prod.js is node, whose server.keepAliveTimeout defaults to 5s;
    # measured at 6.0s against the running server, so 4s leaves room.
    keepalive          32;
    keepalive_timeout  4s;
    keepalive_requests 1000;
}
upstream content_node {
    # The node port of the content service (tools/content-node), run by compose
    # with `restart: unless-stopped`. Loopback while it shares the host's
    # network namespace; a service name once the graph is a container too and
    # both join the compose network (specs/006 D13).
    server 127.0.0.1:4400;
    # Tomcat, as a backup. The paths are identical on both -- node serves the
    # same /ContentService/... URI Java does -- so if the node container is
    # down, stopped for a rebuild, or still warming its caches, nginx retries
    # here and the reader gets Java's answer instead of a 502.
    #
    # That is what makes porting an endpoint at a time safe: each route added
    # is otherwise one more way for a page to break, and the degraded answer
    # differs from the good one only by the subpathway DOIs that Java drops.
    #
    # It does mean a node fault is invisible in the response. `/health` on the
    # service reports `graph: true|false`, and compose restarts it; this is a
    # safety net, not a monitor.
    server 127.0.0.1:8080 backup;
    keepalive 8;
}
upstream content {
    server 127.0.0.1:8080;
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # Tomcat's keepAliveTimeout defaults to 20s; measured at 20.0s, so 10s
    # leaves room.
    keepalive          32;
    keepalive_timeout  10s;
    keepalive_requests 1000;
}
upstream analysis {
    server 127.0.0.1:8080;
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # Tomcat's keepAliveTimeout defaults to 20s; measured at 20.0s, so 10s
    # leaves room.
    keepalive          32;
    keepalive_timeout  10s;
    keepalive_requests 1000;
}
upstream deltasignal {
    server 127.0.0.1:8090;
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # the Julia server held an idle socket past 25s when measured, so 10s
    # is comfortably under it.
    keepalive          32;
    keepalive_timeout  10s;
    keepalive_requests 1000;
}
upstream chatbot {
    server 127.0.0.1:8000;
    # Pooled, and the timeout is the load-bearing number: it MUST be shorter
    # than the backend's own idle timeout, or the backend closes first and this
    # pool hands out sockets that are already gone --
    # this one is uvicorn, not Tomcat: --timeout-keep-alive defaults to 5s
    # and is not set on the container; measured at 5.0s, so 4s leaves room.
    keepalive          32;
    keepalive_timeout  4s;
    keepalive_requests 1000;
}

# The MCP server (reactome-mcp), reached at /mcp/. Loopback only: it binds
# 127.0.0.1 itself and turns on DNS-rebinding protection there, which is what
# stops a page in a visitor's browser driving it. nginx is the only thing in
# front of it.
#
# 502 when it is not running, which is the intended behaviour -- the route
# exists in every environment and the server is turned on per environment.
upstream mcp {
    server 127.0.0.1:4320;
    keepalive 16;
}

# The headless render service, which draws diagram figures (PNG, SVG, GIF,
# PPTX, PDF) with the site's own renderer.
#
# Reached today through the site server, which proxies /RenderService from
# proxy.conf.js. Named here so nginx can put a budget in front of it before it
# ever fronts reactome.org -- which CURATOR-REPORT.md lists as the outstanding
# condition on that.
upstream render {
    server 127.0.0.1:4310;
    keepalive 16;
}

include /etc/nginx/common/websocket.conf;
include /etc/nginx/common/cloudflare-real-ip.conf;
include /etc/nginx/common/block-ai-crawlers.conf;
include /etc/nginx/common/block-all-automation.conf;
# Must follow it: this reads the variable that one defines.
include /etc/nginx/common/mcp-automation-exemption.conf;

limit_req_zone  $binary_remote_addr zone=rel_rate:10m rate=100r/s;

# A budget of its own, far tighter than the site's. Its README is explicit that
# the HTTP transport must sit behind something that rate-limits, and the reason
# is per-request cost rather than volume: `reactome_analyze_identifiers`
# submits a real job to the Analysis Service. The site's 100r/s is sized for
# page assets and would let one client queue analyses as fast as it can ask.
limit_req_zone $binary_remote_addr zone=mcp_rate:10m rate=2r/s;

# A budget for renders, two orders of magnitude tighter than the site's.
#
# A render is a headless browser drawing a canvas -- R-HSA-109606 comes back as
# a 7 MB, 11952x6700 PNG -- so the cost per request is seconds of CPU rather
# than a file read. The site's 100r/s is sized for page assets, and crawlers on
# the old /ContentService/exporter/* URLs are what exhausted Tomcat's heap and
# took the origin down. That is the failure this exists to prevent repeating.
#
# 2r/s with a burst of 8, which is the service's own queue depth
# (RENDER_CONCURRENCY=2, RENDER_QUEUE=8): past that it is rejecting anyway, so
# a burst larger than the queue only buys a deeper pile of work to throw away.
limit_req_zone $binary_remote_addr zone=render_rate:10m rate=2r/s;


limit_conn_zone $binary_remote_addr zone=rel_conn:10m;

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/release.reactome.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/release.reactome.org/privkey.pem;
    include             /etc/nginx/common/tls.conf;
    return 503;
}

server {
    listen 80;
    server_name release.reactome.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name release.reactome.org;

    ssl_certificate     /etc/letsencrypt/live/release.reactome.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/release.reactome.org/privkey.pem;
    include             /etc/nginx/common/tls.conf;

    # Denied: this host faces the internet.
    location ~ ^/admin(/|$) { return 403; }

    if ($blocked_crawler)    { return 403; }
    if ($blocked_automation_enforced) { return 403; }

    limit_req  zone=rel_rate burst=100 nodelay;
    limit_conn rel_conn 24;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 64m;

    include /etc/nginx/common/routes.conf;
}
