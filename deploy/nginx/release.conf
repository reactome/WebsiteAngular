# release.reactome.org — the staged release, before it is promoted.
#
# Same posture as the dev box, for the same reason: this host must not be
# indexed. A staged release appearing in search results is worse than beta doing
# so, because its content looks authoritative and its URLs stop working the day
# it is promoted.
#
# It differs from dev in what it points at, not in how it behaves.

upstream site        { server 127.0.0.1:4200; }
upstream content     { server 127.0.0.1:8080; }
upstream analysis    { server 127.0.0.1:8080; }
upstream deltasignal { server 127.0.0.1:8090; }
upstream chatbot     { server 127.0.0.1:8000; }

include /etc/nginx/common/websocket.conf;
include /etc/nginx/common/cloudflare-real-ip.conf;
include /etc/nginx/common/block-ai-crawlers.conf;
include /etc/nginx/common/block-all-automation.conf;

limit_req_zone  $binary_remote_addr zone=rel_rate:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=rel_conn:10m;

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/release.reactome.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/release.reactome.org/privkey.pem;
    include             /etc/nginx/common/tls.conf;
    return 503;
}

server {
    listen 80;
    server_name release.reactome.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name release.reactome.org;

    ssl_certificate     /etc/letsencrypt/live/release.reactome.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/release.reactome.org/privkey.pem;
    include             /etc/nginx/common/tls.conf;

    # Denied: this host faces the internet.
    location ~ ^/admin(/|$) { return 403; }

    if ($blocked_crawler)    { return 403; }
    if ($blocked_automation) { return 403; }

    limit_req  zone=rel_rate burst=100 nodelay;
    limit_conn rel_conn 24;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 64m;

    include /etc/nginx/common/routes.conf;
}
