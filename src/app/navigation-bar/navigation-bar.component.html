<header class="navbar-header">
  <div class="navbar-logo">
    <a href="/" class="logo-link">
      <img
        src="assets/logo/logo.png"
        alt="Reactome Pathway Database"
        class="logo-image"
      />
    </a>
  </div>
  
  <nav class="navbar-nav">
    <mat-icon class="menu-icon" *ngIf="windowWidth <= 768" (click)="toggleHamburgerMenu()">menu</mat-icon>
    <ul class="nav-list" *ngIf="windowWidth > 768 || activeHamburgerMenu">
      <li
        *ngFor="let option of navOptions | keyvalue:preserveOrder"
        class="nav-item"
        [class.active]="activeDropdown === option.key"
        (mouseenter)="showDropdown(option.key)"
        (mouseleave)="hideDropdown()"
        (click)="toggleDropdown(option.key)"
      >
        <div class="nav-link-wrapper">
          <a
            [attr.href]="(windowWidth > 768 || option.value.label == 'Download') ? option.value.link : null"
            class="nav-link"
            [class.has-dropdown]="
              option.value.dropdownLinks && (option.value.dropdownLinks | keyvalue:preserveOrder).length > 0
            "
          >
            <mat-icon>
              {{ option.value.icon }}
            </mat-icon>
            {{ option.value.label }}
            <mat-icon
              *ngIf="
                option.value.dropdownLinks && (option.value.dropdownLinks | keyvalue:preserveOrder).length > 0
              "
              class="dropdown-arrow"
            >
                keyboard_arrow_down
            </mat-icon>
          </a>
        </div>

        <div
          *ngIf="
            option.value.dropdownLinks && (option.value.dropdownLinks | keyvalue:preserveOrder).length > 0
          "
          class="dropdown-menu"
          [class.show]="activeDropdown === option.key"
        >
          <ul class="dropdown-list">
            <li
              *ngFor="let linkItem of option.value.dropdownLinks | keyvalue:preserveOrder"
              class="dropdown-item"
            >
              <a [href]="linkItem.value.link" class="dropdown-link">
                {{ linkItem.value.label }}
              </a>
            </li>
          </ul>
        </div>
      </li>
    </ul>
  </nav>
</header>
