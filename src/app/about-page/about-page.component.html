<app-page-layout>
  <div class="about-page">
    @if (loading) {
        <div class="loading">Loading...</div>
    } @else if (error) {
        <div class="error">
        <h1>Page Not Found</h1>
        <p>{{ error }}</p>
        <a routerLink="/">Return to Home</a>
        </div>
    } @else if (page) {
        <article class="about-content">
        <header class="about-header">
            @if (page.category) {
            <span class="category-badge">{{ page.category }}</span>
            }
            <h1>{{ page.title }}</h1>
            @if (page.description) {
            <p class="description">{{ page.description }}</p>
            }
        </header>

        <div class="about-body" [innerHTML]="renderedContent"></div>
        </article>
    }
  </div>
</app-page-layout>
