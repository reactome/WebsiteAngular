<div class="news-article-container" *ngIf="!loading">
  <div *ngIf="error" class="error-message">
    <h1>{{ error }}</h1>
  </div>
  
  <article *ngIf="article" class="news-article">
    <header class="article-header">
      <h1 class="article-title">{{ article.title }}</h1>
      <div class="article-meta">
        <time class="article-date">{{ article.datePublished | date: 'fullDate' }}</time>
        <span *ngIf="article.author" class="article-author">by {{ article.author }}</span>
      </div>
      <div *ngIf="article.tags" class="article-tags">
        <span *ngFor="let tag of article.tags" class="tag">{{ tag }}</span>
      </div>
    </header>
    
    <div class="article-body">
      {{ article.content }}
    </div>
  </article>
</div>

<div *ngIf="loading" class="loading-message">
  Loading article...
</div>
