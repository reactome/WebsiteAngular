name: CMS Branch Guard

on:
  pull_request:

jobs:
  restrict-cms-branches:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # IMPORTANT for diff to work properly

      - name: Validate CMS branch changes
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          BASE_REF="${{ github.base_ref }}"

          echo "Branch: $BRANCH_NAME"
          echo "Base: $BASE_REF"

          if [[ "$BRANCH_NAME" == cms/* ]]; then
            echo "CMS branch detected — enforcing content rules"

            # Get changed files (including renames, deletions, etc.)
            #
            # --no-renames matters. With rename detection on, --name-only prints
            # only a rename's destination, so `git mv package.json
            # projects/website-angular/content/sneaky.mdx` shows one allowed path
            # and the deletion of package.json is invisible to the check below.
            # Without detection, the same change prints both paths and the source
            # is judged on its own.
            CHANGED_FILES=$(git diff --no-renames --name-only origin/$BASE_REF...HEAD)

            echo "Changed files:"
            echo "$CHANGED_FILES"

            # Allowed patterns:
            # 1. Content files
            # 2. Upload images
            #
            # mdx is the one that matters: every one of the 253 authored content
            # files is .mdx, because the Tina collections are format "mdx". The
            # list here said md|json|yml, which matches none of them -- so this
            # guard rejected every content edit it exists to permit, and no cms/*
            # branch had ever merged. md and yml are kept for content that may be
            # authored that way later; json is what the generated index files are.
            #
            # content-dist/ is deliberately absent. It is the compiled JSON the
            # browser reads, and stage:content rebuilds it in both tests.yml and
            # deploy.yml, so a content PR neither needs nor should carry it.
            ALLOWED_REGEX="^(projects/website-angular/content/.*\.(mdx|md|json|yml)|projects/website-angular/public/uploads/.*\.(png|jpg|jpeg|webp|gif|svg))$"

            # Find invalid files
            INVALID_FILES=$(echo "$CHANGED_FILES" | grep -vE "$ALLOWED_REGEX" || true)

            if [ -n "$INVALID_FILES" ]; then
              echo ""
              echo "ERROR: Invalid files detected in CMS branch"
              echo ""
              echo "The following files are NOT allowed:"
              echo "$INVALID_FILES"
              echo ""
              echo "The following files are allowed:"
              echo "  - projects/website-angular/content/**/*.mdx|md|json|yml"
              echo "  - projects/website-angular/public/uploads/**/*.(png|jpg|jpeg|webp|gif|svg)"
              echo ""
              echo "Tip: CMS branches (cms/*) are only for content editing."
              echo "   If you need to change code, create a separate branch."
              echo ""

              exit 1
            else
              echo ""
              echo "All changes are valid for a CMS branch!"
              echo ""
            fi

          else
            echo "Not a CMS branch — skipping CMS restrictions"
          fi
