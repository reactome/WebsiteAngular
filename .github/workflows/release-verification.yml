name: Release verification

# Is the release right?
#
# Reactome releases quarterly. This asks the questions only a finished release
# can answer: does every top-level pathway draw, does every download link
# resolve, do the version, the news and the statistics name the release actually
# being served. Those checks fail on a code runner for want of data rather than
# for want of correctness, which is why they are not in tests.yml.
#
# Run it against the deployed site being verified, given as an input. It runs
# against a deployed site rather than this checkout on purpose: it verifies what
# was published.
#
# It ran nightly against beta until 2026-09-15 and no longer does. A release is a
# quarterly event, so a daily schedule was a poor proxy for one -- and that job
# had not reported since 10 September, killed at its own timeout every night, so
# nobody saw a result. The suite passes in under three minutes run by hand.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: The deployed site to verify
        required: true
        default: https://reactome.org

permissions:
  contents: read

jobs:
  verify:
    name: Verify the release
    runs-on: ubuntu-latest
    # 30 was not enough, and the way it was not enough hid the answer: the job was
    # killed mid-run, so nobody saw which check failed or why. One test alone
    # budgets 12 minutes -- 21 diagram loads from the release announcement.
    #
    # It is slow only from a runner: that test takes 1.1 minutes from a machine
    # beside the site and about 12 from a two-core runner reaching it over the
    # internet. The runner is the honest environment for a check on a published
    # site, so the budget moves rather than the test.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # `.nvmrc`, not a second copy of the number: git hooks and preflight
          # read that file too, so a bump reaches CI and local checks together.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # An empty site is not a harmless mistake here. playwright.config.ts falls
      # back to http://localhost:4200 and starts its own server when
      # E2E_BASE_URL is unset, so these checks would run against a build from
      # this checkout -- which has none of the release's data, and would fail for
      # want of it. That is exactly the confusion the suite was split in two to
      # end, so it stops here instead.
      - name: Refuse to run against nothing
        run: |
          if [ -z "${{ inputs.base_url }}" ]; then
            echo "::error::No site given. These checks verify a deployed release; there is nothing to check without one."
            exit 1
          fi

      # No build and no server: this runs against a deployed site, which serves
      # its own assets and routes its own API calls. That is the point -- it
      # verifies what was published, not what this checkout would produce.
      - name: Verify
        # There was a REACTOME_BACKEND here. It did nothing: that variable is
        # read by proxy.conf.js, which only runs when this repo serves the app,
        # and this job starts no server. An input implying control it does not
        # have is worse than no input.
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
        run: npm run e2e:release

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: release-verification-report
          path: playwright-report/
          retention-days: 14
