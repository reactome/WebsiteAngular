name: Tests

# Runs on pushes to main as well as PRs. This used to be pull_request-only,
# which meant it silently stopped running once work started going straight to
# main -- it last ran in April while main kept moving.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # No build step needed: no remaining spec imports the workspace libraries
      # from dist/, so this passes on a clean checkout.
      - name: Test
        run: npm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # src/styles.scss @use's all three of these from dist/, and the
      # pathway-browser build copies reactome-cytoscape-style's assets, so the
      # app cannot be served until they exist.
      - name: Build workspace libraries
        run: |
          npx ng build reactome-cytoscape-style
          npx ng build ngx-reactome-style
          npx ng build reactome-table
          npx ng build reactome-gsa-form

      # site-search-index.json is generated, not committed, and the search
      # specs depend on it.
      - name: Generate content indices
        run: npm run generate:indices

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `ng serve` itself and waits for :4200.
      # Backend calls go through proxy.conf.json to dev.reactome.org, so this
      # exercises real data -- which also means a dev-backend outage will show
      # up here as a failure. Retries are set to 2 under CI to absorb blips.
      - name: Run e2e
        run: npm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
